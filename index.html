<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProLight Console Web</title>
<style>
    :root { --bg-dark: #111; --panel-bg: #222; --accent: #ffcc00; --text: #eee; --border: #333; }
    body { margin: 0; background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
    
    /* Startup Screen */
    #startup-screen { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    .startup-box { background: var(--panel-bg); padding: 30px; border-radius: 5px; border: 1px solid var(--border); text-align: center; }
    .btn { background: #333; color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; margin: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    .btn:hover { background: var(--accent); color: #000; }
    
    /* Main Workspace */
    #workspace { display: none; height: 100vh; grid-template-rows: 40px 1fr 150px 40px; grid-template-columns: 250px 1fr 300px; }
    .header { grid-column: 1 / -1; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: #888; }
    
    /* Panels */
    .panel { border: 1px solid var(--border); background: var(--panel-bg); display: flex; flex-direction: column; overflow: hidden; }
    .panel-title { background: #000; color: var(--accent); padding: 5px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    
    /* Stage Visualizer */
    #stage-panel { grid-column: 2 / 3; grid-row: 2 / 3; }
    canvas { width: 100%; height: 100%; background: #0a0a0a; }
    
    /* Executors */
    #executor-panel { grid-column: 1 / -1; grid-row: 3 / 4; display: flex; padding: 5px; gap: 5px; }
    .executor { flex: 1; background: #1a1a1a; border: 1px solid #444; display: flex; flex-direction: column; }
    .fader-track { flex: 1; background: #000; margin: 5px 20px; position: relative; }
    .fader-cap { width: 100%; height: 20px; background: #555; position: absolute; bottom: 0; cursor: pointer; border-bottom: 3px solid var(--accent); }
    .exec-btn { background: #333; border: 1px solid #555; color: white; padding: 5px; text-align: center; font-size: 10px; cursor: pointer; }
    .exec-btn:active { background: var(--accent); color: black; }
    
    /* Command Line */
    #cmd-panel { grid-column: 1 / -1; grid-row: 4 / 5; display: flex; background: #000; }
    #cmd-input { flex: 1; background: transparent; border: none; color: var(--accent); font-family: monospace; font-size: 16px; padding: 0 10px; outline: none; }
    
    /* Encoders */
    #encoder-panel { grid-column: 3 / 4; grid-row: 2 / 3; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .encoder { background: #111; border: 1px solid var(--border); aspect-ratio: 1; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; color: #888; font-size: 10px; cursor: ns-resize; }
    .encoder::after { content: ''; position: absolute; top: 5px; width: 4px; height: 15px; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>

<!-- Startup Screen -->
<div id="startup-screen">
    <div class="startup-box">
        <h1 style="color: var(--accent); margin-top:0;">PROLIGHT ONPC</h1>
        <p style="color: #888; font-size: 12px;">v1.0.0 - Web Console</p>
        <button class="btn" onclick="startShow()">New Show</button>
        <button class="btn">Load Show</button>
    </div>
</div>

<!-- Main Workspace -->
<div id="workspace">
    <div class="header">
        Show: <span style="color:white; margin-left:5px; margin-right:20px;">New Show</span>
        State: <span id="sys-state" style="color:var(--accent); margin-left:5px;">CLEAR</span>
    </div>
    
    <!-- Fixture Selection / Patch -->
    <div class="panel" style="grid-column: 1 / 2; grid-row: 2 / 3;">
        <div class="panel-title">Fixture Sheet</div>
        <div id="fixture-sheet" style="padding: 10px; font-family: monospace; font-size: 12px; overflow-y: auto;">
            <!-- Rendered by JS -->
        </div>
    </div>
    
    <!-- Stage -->
    <div class="panel" id="stage-panel">
        <div class="panel-title">Stage 2D Visualizer</div>
        <canvas id="stage-canvas"></canvas>
    </div>
    
    <!-- Encoders -->
    <div class="panel" style="grid-column: 3 / 4; grid-row: 2 / 3;">
        <div class="panel-title">Programmer / Encoders</div>
        <div id="encoder-panel">
            <div class="encoder">DIM</div>
            <div class="encoder">PAN</div>
            <div class="encoder">TILT</div>
            <div class="encoder">ZOOM</div>
        </div>
    </div>
    
    <!-- Executors -->
    <div class="panel" id="executor-panel">
        <!-- Generated by JS -->
    </div>
    
    <!-- Command Line -->
    <div id="cmd-panel">
        <div style="background: var(--accent); color: black; padding: 10px; font-weight: bold; font-family: monospace;">CMD</div>
        <input type="text" id="cmd-input" placeholder="Fixture 1 Thru 3 At 100..." autocomplete="off">
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    const showData = {
        patch: [
            { id: 1, name: "MH01", type: "Moving Head", universe: 1, address: 1, x: 200, y: 150 },
            { id: 2, name: "MH02", type: "Moving Head", universe: 1, address: 17, x: 400, y: 150 },
            { id: 3, name: "MH03", type: "Moving Head", universe: 1, address: 33, x: 600, y: 150 }
        ],
        cues: []
    };
    
    const dmxUniverse = new Uint8Array(512); // Virtual DMX Engine
    let programmerSelection = [];
    
    // --- UI INITIALIZATION ---
    function startShow() {
        document.getElementById('startup-screen').style.display = 'none';
        document.getElementById('workspace').style.display = 'grid';
        renderFixtureSheet();
        buildExecutors();
        initVisualizer();
        document.getElementById('cmd-input').focus();
    }
    
    function renderFixtureSheet() {
        const sheet = document.getElementById('fixture-sheet');
        sheet.innerHTML = showData.patch.map(f => 
            `<div style="padding: 3px; border-bottom: 1px solid #333;">
                <span style="color: yellow;">Fix ${f.id}</span> [${f.address}] ${f.name}
            </div>`
        ).join('');
    }
    
    function buildExecutors() {
        const execPanel = document.getElementById('executor-panel');
        for(let i=1; i<=5; i++) {
            execPanel.innerHTML += `
                <div class="executor">
                    <div style="text-align:center; font-size:10px; padding:2px; background:#000; color:#888;">EXEC ${i}</div>
                    <div class="fader-track"><div class="fader-cap" style="height: 0%;"></div></div>
                    <div class="exec-btn">GO</div>
                    <div class="exec-btn" style="background:#522;">FLASH</div>
                </div>
            `;
        }
    }
    
    // --- COMMAND LINE PARSER ---
    const cmdInput = document.getElementById('cmd-input');
    cmdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            executeCommand(this.value.trim().toLowerCase());
            this.value = '';
        }
    });
    
    function executeCommand(cmd) {
        // Basic Parser for: "fixture 1 thru 3 at 100" or "clear"
        if (cmd === 'clear') {
            programmerSelection = [];
            dmxUniverse.fill(0); // Reset for demo
            console.log("Programmer Cleared");
            return;
        }
        
        const fixRegex = /fixture\s+(\d+)(?:\s+thru\s+(\d+))?(?:\s+at\s+(\d+))?/;
        const match = cmd.match(fixRegex);
        
        if (match) {
            const startId = parseInt(match[1]);
            const endId = match[2] ? parseInt(match[2]) : startId;
            const value = match[3] ? parseInt(match[3]) : null;
            
            for (let i = startId; i <= endId; i++) {
                const fix = showData.patch.find(f => f.id === i);
                if (fix) {
                    if (!programmerSelection.includes(i)) programmerSelection.push(i);
                    // Map "At %" to DMX 0-255 (Dimmer is assumed to be offset + 0)
                    if (value !== null) {
                        const dmxVal = Math.floor((value / 100) * 255);
                        dmxUniverse[fix.address - 1] = dmxVal;
                    }
                }
            }
        }
    }
    
    // --- STAGE VISUALIZER ---
    function initVisualizer() {
        const canvas = document.getElementById('stage-canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Stage Grid
            ctx.strokeStyle = '#222';
            ctx.beginPath();
            for(let i=0; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
            for(let j=0; j<canvas.height; j+=50) { ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); }
            ctx.stroke();
            
            // Render Fixtures based on DMX state
            showData.patch.forEach(fix => {
                const dimDmx = dmxUniverse[fix.address - 1]; // Assume Ch 1 is Dimmer
                const intensity = dimDmx / 255;
                
                // Draw Beam
                if (intensity > 0) {
                    const gradient = ctx.createRadialGradient(fix.x, fix.y, 10, fix.x, fix.y, 100);
                    gradient.addColorStop(0, `rgba(255, 255, 200, ${intensity * 0.8})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(fix.x, fix.y, 100, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Draw Fixture Body
                ctx.fillStyle = programmerSelection.includes(fix.id) ? '#ffcc00' : '#444';
                ctx.fillRect(fix.x - 15, fix.y - 15, 30, 30);
                ctx.fillStyle = '#000';
                ctx.fillText(`F${fix.id}`, fix.x - 6, fix.y + 4);
            });
            
            requestAnimationFrame(draw);
        }
        draw();
    }
</script>
</body>
</html>
