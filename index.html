<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Lighting Console Simulator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00bcd4;
            --accent-hover: #00acc1;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #181818;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Stage Visualizer Area */
        .stage-area {
            flex: 1;
            background-color: #0a0a0a;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--border-color);
        }

        .stage-grid {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }

        .fixture-beam {
            position: absolute;
            bottom: 20px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,188,212,0.4) 40%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear, width 0.1s, height 0.1s, opacity 0.1s;
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.5);
            pointer-events: none;
        }

        .fixture-base-icon {
            position: absolute;
            bottom: 10px;
            width: 40px;
            height: 15px;
            background: #444;
            border-radius: 3px;
            transform: translateX(-50%);
            text-align: center;
            font-size: 9px;
            line-height: 15px;
            color: #aaa;
        }

        /* Control Panel Area */
        .control-panel {
            width: 450px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        .section-box {
            background-color: #252525;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Fixture Selector Buttons */
        .fixture-selectors {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 8px 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #444;
        }

        .btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-hover);
        }

        /* Faders Container */
        .faders-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            text-align: center;
        }

        .fader-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 180px;
        }

        .fader-group input[type=range] {
            writing-mode: bt-lr; /* IE/Edge */
            -webkit-appearance: slider-vertical; /* Webkit */
            width: 25px;
            height: 120px;
            background: #333;
            outline: none;
            cursor: pointer;
        }

        .fader-label {
            font-size: 0.75rem;
            margin-top: 6px;
            color: #ccc;
        }

        .fader-value {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-family: monospace;
        }

        /* Effects & Master Area */
        .action-row {
            display: flex;
            gap: 8px;
        }

        .action-row .btn {
            flex: 1;
        }

        .btn-danger {
            background-color: #d32f2f;
            border-color: #c62828;
            color: white;
        }
        .btn-danger:hover {
            background-color: #c62828;
        }

        .master-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .master-container input[type=range] {
            flex: 1;
            accent-color: #ff9800;
        }
    </style>
</head>
<body>

    <header>
        <h1>grandMA3 Mini Simulator</h1>
        <div style="font-size: 0.8rem; color: #888;">Vanilla HTML/JS Single File</div>
    </header>

    <div class="main-container">
        <!-- Visualizer Panggung -->
        <div class="stage-area">
            <div class="stage-grid" id="stageGrid">
                <!-- Fixture 1 -->
                <div class="fixture-base-icon" style="left: 20%;">F1</div>
                <div class="fixture-beam" id="beam1" style="left: 20%;"></div>
                
                <!-- Fixture 2 -->
                <div class="fixture-base-icon" style="left: 40%;">F2</div>
                <div class="fixture-beam" id="beam2" style="left: 40%;"></div>
                
                <!-- Fixture 3 -->
                <div class="fixture-base-icon" style="left: 60%;">F3</div>
                <div class="fixture-beam" id="beam3" style="left: 60%;"></div>
                
                <!-- Fixture 4 -->
                <div class="fixture-base-icon" style="left: 80%;">F4</div>
                <div class="fixture-beam" id="beam4" style="left: 80%;"></div>
            </div>
        </div>

        <!-- Panel Kontrol -->
        <div class="control-panel">
            
            <!-- Pemilihan Fixture -->
            <div class="section-box">
                <div class="section-title">Fixture Selection</div>
                <div class="fixture-selectors">
                    <button class="btn fx-sel active" onclick="toggleFixture(1)">F 1</button>
                    <button class="btn fx-sel active" onclick="toggleFixture(2)">F 2</button>
                    <button class="btn fx-sel active" onclick="toggleFixture(3)">F 3</button>
                    <button class="btn fx-sel active" onclick="toggleFixture(4)">F 4</button>
                    <button class="btn" onclick="toggleAllFixtures()" id="btnAll">All</button>
                </div>
            </div>

            <!-- Fader Parameter -->
            <div class="section-box">
                <div class="section-title">Attribute Faders</div>
                <div class="faders-grid">
                    <!-- Dimmer -->
                    <div class="fader-group">
                        <input type="range" id="faderDim" min="0" max="100" value="100" oninput="updateValues()">
                        <span class="fader-label">Dim</span>
                        <span class="fader-value" id="valDim">100</span>
                    </div>
                    <!-- Pan -->
                    <div class="fader-group">
                        <input type="range" id="faderPan" min="0" max="100" value="50" oninput="updateValues()">
                        <span class="fader-label">Pan</span>
                        <span class="fader-value" id="valPan">50</span>
                    </div>
                    <!-- Tilt -->
                    <div class="fader-group">
                        <input type="range" id="faderTilt" min="0" max="100" value="50" oninput="updateValues()">
                        <span class="fader-label">Tilt</span>
                        <span class="fader-value" id="valTilt">50</span>
                    </div>
                    <!-- Zoom -->
                    <div class="fader-group">
                        <input type="range" id="faderZoom" min="0" max="100" value="30" oninput="updateValues()">
                        <span class="fader-label">Zoom</span>
                        <span class="fader-value" id="valZoom">30</span>
                    </div>
                    <!-- Effect Speed -->
                    <div class="fader-group">
                        <input type="range" id="faderSpeed" min="0" max="100" value="50" oninput="updateValues()">
                        <span class="fader-label">Speed</span>
                        <span class="fader-value" id="valSpeed">50</span>
                    </div>
                </div>
            </div>

            <!-- Efek Otomatis -->
            <div class="section-box">
                <div class="section-title">Effects Generator</div>
                <div class="action-row">
                    <button class="btn" onclick="startEffect('circle')">Circle Effect</button>
                    <button class="btn" onclick="startEffect('tilt')">Tilt Sweep</button>
                    <button class="btn btn-danger" onclick="stopEffect()">Stop Effect</button>
                </div>
            </div>

            <!-- Grand Master -->
            <div class="section-box">
                <div class="section-title">Grand Master</div>
                <div class="master-container">
                    <input type="range" id="faderMaster" min="0" max="100" value="100" oninput="updateValues()">
                    <span class="fader-value" id="valMaster" style="font-size: 0.9rem; min-width: 35px;">100%</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // State data untuk 4 Fixture
        const fixtures = {
            1: { selected: true, dim: 100, pan: 50, tilt: 50, zoom: 30 },
            2: { selected: true, dim: 100, pan: 50, tilt: 50, zoom: 30 },
            3: { selected: true, dim: 100, pan: 50, tilt: 50, zoom: 30 },
            4: { selected: true, dim: 100, pan: 50, tilt: 50, zoom: 30 }
        };

        let currentEffect = null;
        let effectInterval = null;
        let animStep = 0;

        // Toggle pemilihan fixture individual
        function toggleFixture(id) {
            fixtures[id].selected = !fixtures[id].selected;
            const buttons = document.querySelectorAll('.fx-sel');
            buttons[id-1].classList.toggle('active', fixtures[id].selected);
            syncUIFromState();
        }

        // Toggle semua fixture sekaligus
        function toggleAllFixtures() {
            const allSelected = Object.values(fixtures).every(f => f.selected);
            const newState = !allSelected;
            for (let id in fixtures) {
                fixtures[id].selected = newState;
            }
            document.querySelectorAll('.fx-sel').forEach(btn => {
                btn.classList.toggle('active', newState);
            });
            document.getElementById('btnAll').classList.toggle('active', newState);
        }

        // Sinkronisasi nilai fader UI ke objek state fixture yang aktif
        function updateValues() {
            const dim = parseInt(document.getElementById('faderDim').value);
            const pan = parseInt(document.getElementById('faderPan').value);
            const tilt = parseInt(document.getElementById('faderTilt').value);
            const zoom = parseInt(document.getElementById('faderZoom').value);
            
            // Update teks label
            document.getElementById('valDim').innerText = dim;
            document.getElementById('valPan').innerText = pan;
            document.getElementById('valTilt').innerText = tilt;
            document.getElementById('valZoom').innerText = zoom;
            document.getElementById('valSpeed').innerText = document.getElementById('faderSpeed').value;
            document.getElementById('valMaster').innerText = document.getElementById('faderMaster').value + '%';

            // Terapkan ke fixture yang sedang dipilih
            for (let id in fixtures) {
                if (fixtures[id].selected) {
                    fixtures[id].dim = dim;
                    fixtures[id].pan = pan;
                    fixtures[id].tilt = tilt;
                    fixtures[id].zoom = zoom;
                }
            }
            renderStage();
        }

        // Ambil nilai rata-rata untuk menggerakkan fader UI saat efek berjalan
        function syncUIFromState() {
            // Ambil dari fixture pertama yang aktif sebagai sampel visual fader
            let sample = fixtures[1].selected ? fixtures[1] : fixtures[2];
            document.getElementById('faderDim').value = sample.dim;
            document.getElementById('faderPan').value = sample.pan;
            document.getElementById('faderTilt').value = sample.tilt;
            document.getElementById('faderZoom').value = sample.zoom;
            
            document.getElementById('valDim').innerText = sample.dim;
            document.getElementById('valPan').innerText = sample.pan;
            document.getElementById('valTilt').innerText = sample.tilt;
            document.getElementById('valZoom').innerText = sample.zoom;
        }

        // Render posisi, ukuran, dan intensitas cahaya ke layar simulasi 3D sederhana
        function renderStage() {
            const master = parseInt(document.getElementById('faderMaster').value) / 100;

            for (let id = 1; id <= 4; id++) {
                let f = fixtures[id];
                let beam = document.getElementById('beam' + id);

                // Hitung koordinat X berdasarkan Pan (0-100% -> -80px sampai +80px offset)
                let offsetX = (f.pan - 50) * 1.6;
                // Hitung koordinat Y berdasarkan Tilt (0-100% -> -100px sampai +20px offset)
                let offsetY = (50 - f.tilt) * 2.0;

                // Hitung ukuran beam berdasarkan Zoom dan Dimmer
                let size = f.zoom * 1.5 + 20;
                let finalDim = (f.dim / 100) * master;

                beam.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                beam.style.width = `${size}px`;
                beam.style.height = `${size}px`;
                beam.style.opacity = finalDim;
            }
        }

        // Sistem Efek Otomatis (Phaser Simulation)
        function startEffect(type) {
            stopEffect();
            currentEffect = type;
            
            let speedControl = document.getElementById('faderSpeed');

            effectInterval = setInterval(() => {
                let speed = parseInt(speedControl.value);
                // Interval delay berbanding terbalik dengan speed
                animStep += (speed * 0.002);

                for (let id = 1; id <= 4; id++) {
                    if (!fixtures[id].selected) continue;

                    // Offset fase berbeda tiap lampu agar membentuk pola dinamis
                    let phaseOffset = id * 1.5;

                    if (currentEffect === 'circle') {
                        fixtures[id].pan = 50 + Math.sin(animStep + phaseOffset) * 30;
                        fixtures[id].tilt = 50 + Math.cos(animStep + phaseOffset) * 25;
                    } else if (currentEffect === 'tilt') {
                        fixtures[id].tilt = 50 + Math.sin(animStep * 2 + phaseOffset) * 40;
                    }
                }

                syncUIFromState();
                renderStage();
            }, 30);
        }

        function stopEffect() {
            if (effectInterval) {
                clearInterval(effectInterval);
                effectInterval = null;
            }
            currentEffect = null;
        }

        // Jalankan render awal saat halaman dimuat
        renderStage();
    </script>
</body>
</html>
