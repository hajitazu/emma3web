<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Lighting Console - grandMA Workflow Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-base: #0a0b0d;
            --bg-panel: #14171d;
            --bg-header: #1e222b;
            --border-color: #2a303c;
            --accent-color: #00d2ff;
            --accent-active: #ff9900;
            --text-main: #d0d6e0;
            --text-dim: #606b7d;
            --fader-track: #090a0c;
            --fader-knob: #3a4150;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Consolas', 'Fira Code', 'Segoe UI', monospace; }
        body, html { width: 100vw; height: 100vh; background-color: var(--bg-base); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

        /* Top Bar Navigation */
        #top-bar { height: 32px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; }
        .top-title { font-weight: bold; color: var(--accent-color); letter-spacing: 1px; }
        .top-info span { margin-left: 12px; color: var(--text-dim); }
        .top-info span b { color: var(--accent-active); }

        /* Main Workspace: Left 3D Visualizer, Right Console Panel */
        #main-workspace { flex: 1; display: grid; grid-template-columns: 45vw 1fr; height: calc(100vh - 64px); gap: 2px; background: var(--border-color); }
        .panel { background: var(--bg-panel); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .panel-header { height: 24px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; color: var(--text-dim); }

        /* 3D Visualizer Viewport */
        #stage-panel { grid-column: 1; position: relative; }
        #canvas-3d { width: 100%; height: 100%; display: block; }
        .camera-overlay { position: absolute; top: 30px; left: 8px; display: flex; gap: 4px; z-index: 10; }
        .cam-btn { background: rgba(0,0,0,0.7); border: 1px solid var(--border-color); color: #fff; padding: 3px 6px; font-size: 9px; border-radius: 2px; cursor: pointer; }
        .cam-btn:hover { border-color: var(--accent-color); }

        /* Right Side Console Workspace Grid */
        #console-workspace { grid-column: 2; display: grid; grid-template-rows: 1fr 220px; grid-template-columns: 200px 1fr; gap: 2px; background: var(--border-color); }

        /* Fixture List Panel */
        #fixture-panel { grid-column: 1; grid-row: 1; }
        .fixture-list { flex: 1; overflow-y: auto; padding: 4px; }
        .fixture-item { display: flex; justify-content: space-between; padding: 5px; border: 1px solid var(--border-color); margin-bottom: 3px; border-radius: 2px; font-size: 10px; cursor: pointer; background: #0f1115; }
        .fixture-item.selected { border-color: var(--accent-color); background: rgba(0,210,255,0.15); }

        /* Effect Pool Grid Panel */
        #effect-panel { grid-column: 2; grid-row: 1; }
        .effect-pool { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 6px; overflow-y: auto; flex: 1; }
        .effect-card { background: #101217; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 2px; padding: 6px 4px; font-size: 9px; text-align: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; flex-direction: column; justify-content: center; }
        .effect-card:hover { border-color: var(--accent-color); background: #1a1e27; }
        .effect-card.active { border-color: var(--accent-active); background: rgba(255,153,0,0.15); color: var(--accent-active); }
        .effect-card .cat { font-size: 7px; color: var(--text-dim); margin-bottom: 2px; text-transform: uppercase; }

        /* Bottom Controls: Encoders & Executors */
        #controls-bottom { grid-column: 1 / span 2; grid-row: 2; display: grid; grid-template-columns: 240px 1fr; gap: 2px; background: var(--border-color); }
        .encoder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; }
        .encoder-wheel { background: #0f1115; border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .knob-graphic { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--text-dim); border-top-color: var(--accent-color); margin: 3px 0; position: relative; cursor: ns-resize; }
        .knob-graphic::after { content: ''; position: absolute; top: 3px; left: 15px; width: 2px; height: 10px; background: var(--accent-color); }

        /* Executor Faders */
        .fader-bank { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 6px; overflow-x: auto; flex: 1; }
        .fader-strip { background: #0f1115; border: 1px solid var(--border-color); border-radius: 3px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .fader-track { width: 10px; flex: 1; background: var(--fader-track); margin: 4px 0; border-radius: 5px; position: relative; cursor: pointer; touch-action: none; }
        .fader-knob { width: 20px; height: 12px; background: var(--fader-knob); border: 1px solid var(--accent-color); border-radius: 2px; position: absolute; left: -5px; bottom: 0; cursor: grab; }
        .exec-btn { width: 100%; height: 20px; background: var(--bg-header); border: 1px solid var(--border-color); color: var(--text-main); font-size: 8px; font-weight: bold; border-radius: 2px; cursor: pointer; }
        .exec-btn.active { background: var(--accent-active); color: #000; }

        /* Command Line Interface (CLI) */
        #cli-panel { height: 32px; background: #08090b; display: flex; align-items: center; padding: 0 10px; border-top: 1px solid var(--border-color); font-size: 11px; }
        .cli-prompt { color: var(--accent-color); font-weight: bold; margin-right: 8px; }
        #cli-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 12px; }
        .cli-output { position: absolute; bottom: 32px; left: 0; right: 0; background: rgba(8, 9, 11, 0.95); border-top: 1px solid var(--border-color); max-height: 100px; overflow-y: auto; padding: 6px 12px; font-size: 10px; color: var(--text-dim); display: none; z-index: 50; }
        .cli-output .err { color: #e63946; }
        .cli-output .info { color: var(--accent-color); }
    </style>
</head>
<body>

    <!-- Top Bar Navigation -->
    <div id="top-bar">
        <div class="top-title">MA CONSOLE 3D <span>v3.5 - FULL EFFECT ENGINE</span></div>
        <div class="top-info">
            ACTIVE FX: <b id="fx-count-disp">0 Active</b>
            SEL FIX: <b id="sel-count-disp">0</b>
            BPM: <b id="bpm-disp">120</b>
            FPS: <b id="fps-disp">60</b>
        </div>
        <div>
            <button class="cam-btn" onclick="app.clearEffects()">CLEAR FX</button>
            <button class="cam-btn" onclick="app.saveShow()">SAVE</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="main-workspace">
        
        <!-- Left: Unobstructed 3D Stage Visualizer -->
        <div class="panel" id="stage-panel">
            <div class="panel-header">
                <span>3D Stage Visualizer Viewport</span>
                <span id="cam-mode-disp">CAM: PERSPECTIVE</span>
            </div>
            <div class="camera-overlay">
                <button class="cam-btn" onclick="app.setCameraPreset('front')">FRONT</button>
                <button class="cam-btn" onclick="app.setCameraPreset('top')">TOP</button>
                <button class="cam-btn" onclick="app.setCameraPreset('side')">SIDE</button>
                <button class="cam-btn" onclick="app.setCameraPreset('audience')">AUDIENCE</button>
            </div>
            <canvas id="canvas-3d"></canvas>
        </div>

        <!-- Right: Console Workspace & Effect Pool -->
        <div id="console-workspace">
            
            <!-- Fixture Selection Panel -->
            <div class="panel" id="fixture-panel">
                <div class="panel-header">
                    <span>Fixtures</span>
                    <button class="cam-btn" onclick="app.selectAllFixtures()">ALL</button>
                </div>
                <div class="fixture-list" id="fixture-list-container"></div>
            </div>

            <!-- Effect Pool Panel (Contains all 54 requested effects) -->
            <div class="panel" id="effect-panel">
                <div class="panel-header">
                    <span>Effect Pool Library (54 Presets)</span>
                    <button class="cam-btn" onclick="app.clearEffects()">STOP ALL</button>
                </div>
                <div class="effect-pool" id="effect-pool-container"></div>
            </div>

            <!-- Bottom Console Controls (Encoders + Executors) -->
            <div id="controls-bottom">
                
                <!-- Encoder Deck -->
                <div class="panel" style="border-right: 1px solid var(--border-color);">
                    <div class="panel-header">Encoders</div>
                    <div class="encoder-grid">
                        <div class="encoder-wheel">
                            <span style="font-size: 9px; color: var(--text-dim);">PAN</span>
                            <div class="knob-graphic" onwheel="app.handleEncoderWheel(event, 'pan')"></div>
                            <span id="val-pan" style="font-size: 10px; font-weight: bold;">0°</span>
                        </div>
                        <div class="encoder-wheel">
                            <span style="font-size: 9px; color: var(--text-dim);">TILT</span>
                            <div class="knob-graphic" onwheel="app.handleEncoderWheel(event, 'tilt')"></div>
                            <span id="val-tilt" style="font-size: 10px; font-weight: bold;">0°</span>
                        </div>
                        <div class="encoder-wheel">
                            <span style="font-size: 9px; color: var(--text-dim);">DIMMER</span>
                            <div class="knob-graphic" onwheel="app.handleEncoderWheel(event, 'dimmer')"></div>
                            <span id="val-dimmer" style="font-size: 10px; font-weight: bold;">100%</span>
                        </div>
                        <div class="encoder-wheel">
                            <span style="font-size: 9px; color: var(--text-dim);">ZOOM</span>
                            <div class="knob-graphic" onwheel="app.handleEncoderWheel(event, 'zoom')"></div>
                            <span id="val-zoom" style="font-size: 10px; font-weight: bold;">20°</span>
                        </div>
                    </div>
                </div>

                <!-- Executor Playback Faders -->
                <div class="panel">
                    <div class="panel-header">Executor Playbacks</div>
                    <div class="fader-bank" id="fader-bank-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Command Line Interface (CLI) -->
    <div id="cli-panel">
        <div class="cli-output" id="cli-output"></div>
        <span class="cli-prompt">MA-CLI&gt;</span>
        <input type="text" id="cli-input" placeholder="Type command... (e.g., 'Fixture 1 Thru 8', 'Effect Sine', 'At 100', 'Clear')" autocomplete="off" />
    </div>

    <script>
        /**
         * PROFESSIONAL LIGHTING CONSOLE ENGINE
         * Realtime 3D Visualizer, Full Mathematical Phaser Effect Library, and Console Workflow.
         */
        class LightingConsoleApp {
            constructor() {
                this.fixtures = [];
                this.selectedFixtureIds = new Set();
                this.executors = Array(8).fill(null).map((_, i) => ({ id: i + 1, level: 100, active: true }));
                this.activeEffects = new Map();

                // Complete 54 Effect Definitions
                this.effectLibrary = [
                    // DIMMER EFFECTS
                    { id: "dim_sin", name: "Dimmer Sin", cat: "Dimmer", fn: (t, idx) => Math.sin(t * 3 + idx * 0.5) * 50 + 50 },
                    { id: "dim_chase", name: "Dimmer Chase", cat: "Dimmer", fn: (t, idx) => ((Math.floor(t * 4) % 8) === idx ? 100 : 0) },
                    { id: "dim_pwm", name: "Dimmer PWM", cat: "Dimmer", fn: (t) => (Math.sin(t * 8) > 0 ? 100 : 0) },
                    { id: "dim_rnd", name: "Dimmer Random", cat: "Dimmer", fn: (t, idx) => Math.abs(Math.sin(Math.floor(t * 5) * 99 + idx)) * 100 },
                    { id: "dim_eo", name: "Dimmer Even/Odd", cat: "Dimmer", fn: (t, idx) => (idx % 2 === Math.floor(t * 2) % 2 ? 100 : 0) },

                    // SHUTTER EFFECTS
                    { id: "shut_pwm", name: "Shutter PWM", cat: "Shutter", fn: (t) => (Math.sin(t * 15) > 0 ? 100 : 0) },

                    // COLOR / RGB / CMY EFFECTS
                    { id: "rgb_rb", name: "RGB Rainbow", cat: "Color", fn_col: (t, idx) => `hsl(${(t * 40 + idx * 30) % 360}, 100%, 50%)` },
                    { id: "rgb_rb_inv", name: "=RGB Rainbow", cat: "Color", fn_col: (t, idx) => `hsl(${(360 - (t * 40 + idx * 30)) % 360}, 100%, 50%)` },
                    { id: "rgb_chase", name: "RGB Chase", cat: "Color", fn_col: (t, idx) => ((Math.floor(t * 4) % 8) === idx ? "#00d2ff" : "#111122") },
                    { id: "rgb_bw", name: "RGB Blue White", cat: "Color", fn_col: (t, idx) => (Math.sin(t * 4 + idx) > 0 ? "#0066ff" : "#ffffff") },
                    { id: "rgb_eo", name: "RGB Even/Odd", cat: "Color", fn_col: (t, idx) => (idx % 2 === Math.floor(t * 2) % 2 ? "#ff0055" : "#00d2ff") },
                    { id: "rgb_rnd", name: "RGB Random", cat: "Color", fn_col: (t, idx) => `hsl(${(Math.floor(t * 3) * 137 + idx * 50) % 360}, 100%, 50%)` },
                    { id: "cto_sin", name: "CTO Sin", cat: "Color", fn_col: (t) => `hsl(35, 100%, ${Math.sin(t * 3) * 20 + 60}%)` },
                    { id: "col1_ramp", name: "Color 1 Ramp", cat: "Color", fn_col: (t) => `hsl(${((t * 30) % 120)}, 100%, 50%)` },
                    { id: "col2_ramp", name: "Color 2 Ramp", cat: "Color", fn_col: (t) => `hsl(${(((t * 30) + 120) % 240)}, 100%, 50%)` },
                    { id: "col3_ramp", name: "Color 3 Ramp", cat: "Color", fn_col: (t) => `hsl(${(((t * 30) + 240) % 360)}, 100%, 50%)` },

                    // MOVEMENT EFFECTS
                    { id: "pt_ballyhoo", name: "Dim/P/T Ballyhoo", cat: "Movement", fn_pt: (t, idx) => ({ pan: Math.sin(t * 4 + idx) * 45, tilt: Math.cos(t * 5 + idx) * 30 }) },
                    { id: "pt_flyout", name: "Dim/Tilt Flyout", cat: "Movement", fn_pt: (t, idx) => ({ pan: 0, tilt: ((t * 2 + idx * 0.2) % 1) * -60 }) },
                    { id: "tilt_sin", name: "Tilt Sin", cat: "Movement", fn_pt: (t, idx) => ({ pan: 0, tilt: Math.sin(t * 3 + idx * 0.4) * 40 }) },
                    { id: "pan_sin", name: "Pan Sin", cat: "Movement", fn_pt: (t, idx) => ({ pan: Math.sin(t * 3 + idx * 0.4) * 60, tilt: 0 }) },
                    { id: "tilt_sin_p_stomp", name: "Tilt Sin Pan Stomp", cat: "Movement", fn_pt: (t, idx) => ({ pan: (Math.floor(t * 2 + idx) % 2) * 40 - 20, tilt: Math.sin(t * 4) * 30 }) },
                    { id: "pan_sin_t_stomp", name: "Pan Sin Tilt Stomp", cat: "Movement", fn_pt: (t, idx) => ({ pan: Math.sin(t * 4) * 50, tilt: (Math.floor(t * 2 + idx) % 2) * 30 - 15 }) },
                    { id: "pt_circle", name: "P/T Circle", cat: "Movement", fn_pt: (t, idx) => ({ pan: Math.cos(t * 3 + idx * 0.5) * 35, tilt: Math.sin(t * 3 + idx * 0.5) * 25 }) },
                    { id: "pt_wave", name: "P/T Wave", cat: "Movement", fn_pt: (t, idx) => ({ pan: Math.sin(t * 2 + idx * 0.8) * 40, tilt: Math.cos(t * 2 + idx * 0.8) * 20 }) },
                    { id: "pt_cross", name: "P/T Cross", cat: "Movement", fn_pt: (t, idx) => ({ pan: (idx % 2 === 0 ? 1 : -1) * Math.sin(t * 3) * 40, tilt: Math.cos(t * 3) * 20 }) },

                    // BMP MODULATION
                    { id: "bmp_pos_x", name: "BMP Pos X", cat: "BMP", fn_pt: (t, idx) => ({ pan: Math.sin(t * 6 + idx) * 30, tilt: 0 }) },
                    { id: "bmp_pos_y", name: "BMP Pos Y", cat: "BMP", fn_pt: (t, idx) => ({ pan: 0, tilt: Math.cos(t * 6 + idx) * 20 }) },
                    { id: "bmp_rot_z", name: "BMP Rot Z CW", cat: "BMP", fn_pt: (t, idx) => ({ pan: Math.cos(t * 4 + idx) * 40, tilt: Math.sin(t * 4 + idx) * 40 }) },
                    { id: "bmp_scale_in", name: "BMP Scale In", cat: "BMP", fn: (t) => ((t * 2) % 1) * 100 },
                    { id: "bmp_circle", name: "BMP Circle", cat: "BMP", fn_pt: (t, idx) => ({ pan: Math.sin(t * 5 + idx) * 30, tilt: Math.cos(t * 5 + idx) * 30 }) },
                    { id: "bmp_hue", name: "BMP Rainbow Hue", cat: "BMP", fn_col: (t, idx) => `hsl(${(t * 120 + idx * 20) % 360}, 100%, 50%)` },

                    // FORM / PHASER PATTERNS
                    { id: "form_stomp", name: "Stomp — Form", cat: "Form", fn: () => 0 },
                    { id: "form_release", name: "Release — Form", cat: "Form", fn: () => 0 },
                    { id: "form_random", name: "Random — Form", cat: "Form", fn: (t, idx) => Math.sin(Math.floor(t * 6) * 12 + idx) * 50 + 50 },
                    { id: "form_pwm", name: "PWM — Form", cat: "Form", fn: (t) => (t % 1 > 0.5 ? 100 : 0) },
                    { id: "form_chase", name: "Chase — Form", cat: "Form", fn: (t, idx) => ((Math.floor(t * 5) % 8) === idx ? 100 : 20) },
                    { id: "form_flat_h", name: "Flat High — Form", cat: "Form", fn: () => 100 },
                    { id: "form_flat_l", name: "Flat Low — Form", cat: "Form", fn: () => 0 },
                    { id: "form_sin", name: "Sin — Form", cat: "Form", fn: (t, idx) => Math.sin(t * 3 + idx * 0.5) * 50 + 50 },
                    { id: "form_cos", name: "Cos — Form", cat: "Form", fn: (t, idx) => Math.cos(t * 3 + idx * 0.5) * 50 + 50 },
                    { id: "form_ramp_p", name: "Ramp Plus — Form", cat: "Form", fn: (t, idx) => ((t + idx * 0.1) % 1) * 100 },
                    { id: "form_ramp_m", name: "Ramp Minus — Form", cat: "Form", fn: (t, idx) => (1 - ((t + idx * 0.1) % 1)) * 100 },
                    { id: "form_ramp", name: "Ramp — Form", cat: "Form", fn: (t, idx) => ((t + idx * 0.1) % 1) * 100 },
                    { id: "form_phase1", name: "Phase 1 — Form", cat: "Form", fn: (t, idx) => Math.sin(t * 4 + idx * 0.2) * 50 + 50 },
                    { id: "form_phase2", name: "Phase 2 — Form", cat: "Form", fn: (t, idx) => Math.sin(t * 4 + idx * 0.6) * 50 + 50 },
                    { id: "form_phase3", name: "Phase 3 — Form", cat: "Form", fn: (t, idx) => Math.sin(t * 4 + idx * 1.2) * 50 + 50 },
                    { id: "form_bump", name: "Bump — Form", cat: "Form", fn: (t, idx) => Math.pow(Math.sin(t * 3 + idx * 0.3), 8) * 100 },
                    { id: "form_swing", name: "Swing — Form", cat: "Form", fn_pt: (t, idx) => ({ pan: Math.sin(t * 2 + idx * 0.3) * 45, tilt: 0 }) },
                    { id: "form_ramp50", name: "Ramp 50 — Form", cat: "Form", fn: (t) => ((t * 2) % 1 < 0.5 ? ((t * 4) % 1) * 100 : 0) },
                    { id: "form_circle", name: "Circle — Form", cat: "Form", fn_pt: (t, idx) => ({ pan: Math.cos(t * 3 + idx) * 30, tilt: Math.sin(t * 3 + idx) * 30 }) },
                    { id: "form_sound", name: "Sound — Form", cat: "Form", fn: (t) => Math.random() * 100 },
                    { id: "form_flyout", name: "Flyout — Form", cat: "Form", fn_pt: (t, idx) => ({ pan: 0, tilt: ((t * 2 + idx * 0.1) % 1) * -50 }) },
                    { id: "form_wave", name: "Wave — Form", cat: "Form", fn: (t, idx) => Math.sin(t * 4 + idx * 0.5) * 50 + 50 },
                    { id: "form_cross", name: "Cross — Form", cat: "Form", fn_pt: (t, idx) => ({ pan: (idx % 2 === 0 ? 30 : -30), tilt: Math.sin(t * 3) * 20 }) }
                ];

                // 3D Scene Controls
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.fixtureMeshes = new Map();
                this.beamMeshes = new Map();
                this.camState = { pos: { x: 0, y: 10, z: 24 } };

                this.clock = new THREE.Clock();
                this.fpsCounter = 0;
                this.lastTime = performance.now();

                this.init();
            }

            init() {
                this.setup3DScene();
                this.setupDefaultPatch();
                this.renderFixtureList();
                this.renderEffectPool();
                this.renderExecutors();
                this.setupCLI();

                requestAnimationFrame((t) => this.animate(t));
                this.logCLI("System Started. 54 Professional Effect Engines Loaded.", "info");
            }

            // --- 1. SETUP 3D VISUALIZER (UNOBSTRUCTED STAGE VIEW) ---
            setup3DScene() {
                const container = document.getElementById('stage-panel');
                const canvas = document.getElementById('canvas-3d');
                
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x060709);
                this.scene.fog = new THREE.FogExp2(0x060709, 0.018);

                this.camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.updateCameraTransform();

                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);

                const gridHelper = new THREE.GridHelper(30, 30, 0x00d2ff, 0x1e222b);
                this.scene.add(gridHelper);

                const floorGeo = new THREE.PlaneGeometry(30, 30);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0c0f, roughness: 0.8 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                this.scene.add(floor);

                const trussGeo = new THREE.CylinderGeometry(0.12, 0.12, 22);
                const trussMat = new THREE.MeshStandardMaterial({ color: 0x3a4150, metalness: 0.8 });
                const mainTruss = new THREE.Mesh(trussGeo, trussMat);
                mainTruss.rotation.z = Math.PI / 2;
                mainTruss.position.set(0, 9, -4);
                this.scene.add(mainTruss);

                window.addEventListener('resize', () => {
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });
            }

            setupDefaultPatch() {
                for (let i = 1; i <= 8; i++) {
                    const posX = (i - 4.5) * 2.5;
                    this.fixtures.push({
                        id: i,
                        name: `MH-${i < 10 ? '0' + i : i}`,
                        type: "Spot 300W",
                        x: posX, y: 9, z: -4,
                        basePan: 0, baseTilt: 0,
                        pan: 0, tilt: 0,
                        baseDimmer: 100, dimmer: 100,
                        baseColor: "#00d2ff", color: "#00d2ff",
                        zoom: 20
                    });
                }
                this.rebuildFixture3DMeshes();
            }

            rebuildFixture3DMeshes() {
                this.fixtureMeshes.forEach(m => this.scene.remove(m));
                this.beamMeshes.forEach(b => this.scene.remove(b));

                this.fixtures.forEach(fix => {
                    const headGeo = new THREE.BoxGeometry(0.5, 0.7, 0.5);
                    const headMat = new THREE.MeshStandardMaterial({ color: 0x1e222b });
                    const headMesh = new THREE.Mesh(headGeo, headMat);
                    headMesh.position.set(fix.x, fix.y, fix.z);
                    this.scene.add(headMesh);
                    this.fixtureMeshes.set(fix.id, headMesh);

                    const beamGeo = new THREE.ConeGeometry(1.2, 11, 32, 1, true);
                    beamGeo.translate(0, -5.5, 0);
                    const beamMat = new THREE.MeshBasicMaterial({
                        color: new THREE.Color(fix.color),
                        transparent: true,
                        opacity: 0.4,
                        blending: THREE.AdditiveBlending,
                        side: THREE.DoubleSide
                    });
                    const beamMesh = new THREE.Mesh(beamGeo, beamMat);
                    beamMesh.position.set(fix.x, fix.y, fix.z);
                    this.scene.add(beamMesh);
                    this.beamMeshes.set(fix.id, beamMesh);
                });
            }

            // --- 2. EFFECT POOL & CONSOLE INTERACTION ---
            renderEffectPool() {
                const container = document.getElementById('effect-pool-container');
                container.innerHTML = '';
                this.effectLibrary.forEach(fx => {
                    const card = document.createElement('div');
                    const isActive = this.activeEffects.has(fx.id);
                    card.className = `effect-card ${isActive ? 'active' : ''}`;
                    card.innerHTML = `<span class="cat">${fx.cat}</span><b>${fx.name}</b>`;
                    card.onclick = () => this.toggleEffect(fx);
                    container.appendChild(card);
                });
                document.getElementById('fx-count-disp').innerText = `${this.activeEffects.size} Active`;
            }

            toggleEffect(fx) {
                if (this.activeEffects.has(fx.id)) {
                    this.activeEffects.delete(fx.id);
                    this.logCLI(`Effect Stopped: ${fx.name}`, "info");
                } else {
                    this.activeEffects.set(fx.id, fx);
                    this.logCLI(`Effect Started: ${fx.name}`, "info");
                }
                this.renderEffectPool();
            }

            clearEffects() {
                this.activeEffects.clear();
                this.renderEffectPool();
                this.logCLI("All active effects stopped.", "info");
            }

            renderFixtureList() {
                const container = document.getElementById('fixture-list-container');
                container.innerHTML = '';
                this.fixtures.forEach(fix => {
                    const item = document.createElement('div');
                    item.className = `fixture-item ${this.selectedFixtureIds.has(fix.id) ? 'selected' : ''}`;
                    item.onclick = (e) => this.selectFixture(fix.id, e.shiftKey);
                    item.innerHTML = `
                        <div><b>FID ${fix.id}: ${fix.name}</b></div>
                        <div><span style="color:${fix.color};">■</span> ${Math.round(fix.dimmer)}%</div>
                    `;
                    container.appendChild(item);
                });
                document.getElementById('sel-count-disp').innerText = `${this.selectedFixtureIds.size}`;
            }

            selectAllFixtures() {
                this.fixtures.forEach(f => this.selectedFixtureIds.add(f.id));
                this.renderFixtureList();
            }

            selectFixture(id, multi = false) {
                if (!multi) this.selectedFixtureIds.clear();
                if (this.selectedFixtureIds.has(id)) this.selectedFixtureIds.delete(id);
                else this.selectedFixtureIds.add(id);
                this.renderFixtureList();
            }

            handleEncoderWheel(e, attr) {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 5 : -5;
                if (this.selectedFixtureIds.size === 0) return;
                this.fixtures.forEach(f => {
                    if (this.selectedFixtureIds.has(f.id)) {
                        if (attr === 'pan') f.basePan = Math.max(-180, Math.min(180, f.basePan + delta));
                        if (attr === 'tilt') f.baseTilt = Math.max(-90, Math.min(90, f.baseTilt + delta));
                        if (attr === 'dimmer') f.baseDimmer = Math.max(0, Math.min(100, f.baseDimmer + delta));
                        if (attr === 'zoom') f.zoom = Math.max(5, Math.min(60, f.zoom + delta));
                    }
                });
                this.updateEncoderUI();
            }

            updateEncoderUI() {
                const sel = this.fixtures.find(f => this.selectedFixtureIds.has(f.id));
                if (sel) {
                    document.getElementById('val-pan').innerText = `${sel.basePan}°`;
                    document.getElementById('val-tilt').innerText = `${sel.baseTilt}°`;
                    document.getElementById('val-dimmer').innerText = `${sel.baseDimmer}%`;
                    document.getElementById('val-zoom').innerText = `${sel.zoom}°`;
                }
            }

            renderExecutors() {
                const container = document.getElementById('fader-bank-container');
                container.innerHTML = '';
                this.executors.forEach(exec => {
                    const strip = document.createElement('div');
                    strip.className = 'fader-strip';
                    strip.innerHTML = `
                        <button class="exec-btn ${exec.active ? 'active' : ''}" onclick="app.toggleExecutor(${exec.id})">EX ${exec.id}</button>
                        <div class="fader-track" onpointerdown="app.handleFaderDrag(event, ${exec.id})">
                            <div class="fader-knob" style="bottom: ${exec.level}%;"></div>
                        </div>
                        <span style="font-size:8px; font-weight:bold;">${Math.round(exec.level)}%</span>
                    `;
                    container.appendChild(strip);
                });
            }

            handleFaderDrag(e, execId) {
                const track = e.currentTarget;
                const rect = track.getBoundingClientRect();
                const updateLevel = (evt) => {
                    const offsetY = rect.bottom - evt.clientY;
                    let pct = Math.max(0, Math.min(100, (offsetY / rect.height) * 100));
                    const exec = this.executors.find(x => x.id === execId);
                    if (exec) {
                        exec.level = pct;
                        this.renderExecutors();
                    }
                };
                updateLevel(e);
                const onMove = (evt) => updateLevel(evt);
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            }

            toggleExecutor(id) {
                const exec = this.executors.find(x => x.id === id);
                if (exec) {
                    exec.active = !exec.active;
                    exec.level = exec.active ? 100 : 0;
                    this.renderExecutors();
                }
            }

            // --- 3. ANIMATION TICK & MATHEMATICAL EFFECT COMPUTATION ---
            animate(currentTime) {
                requestAnimationFrame((t) => this.animate(t));

                const elapsedTime = this.clock.getElapsedTime();
                const masterLevel = (this.executors[0]?.level || 100) / 100;

                // Reset base values
                this.fixtures.forEach(f => {
                    f.dimmer = f.baseDimmer * masterLevel;
                    f.color = f.baseColor;
                    f.pan = f.basePan;
                    f.tilt = f.baseTilt;
                });

                // Calculate all active phasers dynamically
                this.activeEffects.forEach(fx => {
                    this.fixtures.forEach((f, idx) => {
                        if (fx.fn) f.dimmer = Math.max(0, Math.min(100, fx.fn(elapsedTime, idx)));
                        if (fx.fn_col) f.color = fx.fn_col(elapsedTime, idx);
                        if (fx.fn_pt) {
                            const pt = fx.fn_pt(elapsedTime, idx);
                            f.pan += pt.pan;
                            f.tilt += pt.tilt;
                        }
                    });
                });

                // Synchronize 3D Scene Fixtures & Lighting Beams
                this.fixtures.forEach(fix => {
                    const head = this.fixtureMeshes.get(fix.id);
                    const beam = this.beamMeshes.get(fix.id);

                    if (head && beam) {
                        head.rotation.y = THREE.MathUtils.degToRad(fix.pan);
                        head.rotation.x = THREE.MathUtils.degToRad(fix.tilt);

                        beam.rotation.y = head.rotation.y;
                        beam.rotation.x = head.rotation.x;

                        const beamMat = beam.material;
                        beamMat.color.set(fix.color);
                        beamMat.opacity = (fix.dimmer / 100) * 0.45;

                        const rad = Math.tan(THREE.MathUtils.degToRad(fix.zoom / 2)) * 11;
                        beam.scale.set(rad, 1, rad);
                    }
                });

                // Frame Counter
                this.fpsCounter++;
                if (currentTime - this.lastTime >= 1000) {
                    document.getElementById('fps-disp').innerText = this.fpsCounter;
                    this.fpsCounter = 0;
                    this.lastTime = currentTime;
                }

                this.renderer.render(this.scene, this.camera);
            }

            updateCameraTransform() {
                this.camera.position.set(this.camState.pos.x, this.camState.pos.y, this.camState.pos.z);
                this.camera.lookAt(0, 3, 0);
            }

            setCameraPreset(preset) {
                if (preset === 'front') this.camState.pos = { x: 0, y: 7, z: 22 };
                if (preset === 'top') this.camState.pos = { x: 0, y: 26, z: 0.1 };
                if (preset === 'side') this.camState.pos = { x: 24, y: 7, z: 0 };
                if (preset === 'audience') this.camState.pos = { x: 0, y: 2, z: 18 };
                document.getElementById('cam-mode-disp').innerText = `CAM: ${preset.toUpperCase()}`;
                this.updateCameraTransform();
            }

            // --- 4. CLI SYNTAX ---
            setupCLI() {
                const input = document.getElementById('cli-input');
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const val = input.value.trim();
                        if (val) {
                            this.parseCommand(val);
                            input.value = '';
                        }
                    }
                });
            }

            parseCommand(cmd) {
                this.logCLI(`> ${cmd}`);
                const parts = cmd.split(/\s+/);
                const head = parts[0].toLowerCase();

                if (head === 'fixture' || head === 'fix') {
                    if (parts[2] && parts[2].toLowerCase() === 'thru') {
                        this.selectedFixtureIds.clear();
                        const s = parseInt(parts[1]), e = parseInt(parts[3]);
                        this.fixtures.forEach(f => { if (f.id >= s && f.id <= e) this.selectedFixtureIds.add(f.id); });
                        this.renderFixtureList();
                    }
                } else if (head === 'at' || head === 'dimmer') {
                    const v = parseInt(parts[1]);
                    this.fixtures.forEach(f => { if (this.selectedFixtureIds.has(f.id)) f.baseDimmer = v; });
                } else if (head === 'clear') {
                    this.selectedFixtureIds.clear();
                    this.renderFixtureList();
                } else if (head === 'effect' || head === 'fx') {
                    const found = this.effectLibrary.find(x => x.name.toLowerCase().includes(parts[1].toLowerCase()));
                    if (found) this.toggleEffect(found);
                }
            }

            logCLI(msg, type = "") {
                const out = document.getElementById('cli-output');
                out.style.display = 'block';
                const d = document.createElement('div');
                d.className = type;
                d.innerText = msg;
                out.appendChild(d);
                out.scrollTop = out.scrollHeight;
            }

            saveShow() {
                localStorage.setItem('ma_show_data', JSON.stringify(this.fixtures));
                this.logCLI("Show setup saved successfully.", "info");
            }
        }

        let app;
        window.addEventListener('DOMContentLoaded', () => { app = new LightingConsoleApp(); });
    </script>
</body>
