<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxControl onPC - Professional Virtual Lighting Console</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        console: {
                            bg: '#121212',
                            panel: '#1a1a1a',
                            border: '#333333',
                            accent: '#ff5500',
                            accentHover: '#ff7722',
                            text: '#e0e0e0',
                            muted: '#888888',
                            active: '#22c55e',
                            selected: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for professional console look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }
        .slider-vertical { writing-mode: bt-lr; -webkit-appearance: slider-vertical; }
    </style>
</head>
<body class="bg-console-bg text-console-text font-mono h-screen flex flex-col overflow-hidden select-none">

    <!-- TOP HEADER / MENU BAR -->
    <header class="bg-console-panel border-b border-console-border h-12 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-console-accent animate-pulse"></span>
                <h1 class="font-bold tracking-wider text-sm sm:text-base text-white">LUXCONTROL <span class="text-console-accent text-xs px-1.5 py-0.5 bg-console-accent/20 rounded">onPC v1.0</span></h1>
            </div>
            <nav class="hidden md:flex items-center space-x-1 text-xs">
                <button onclick="app.newProject()" class="px-2.5 py-1 hover:bg-console-border rounded transition text-console-muted hover:text-white">New</button>
                <button onclick="app.saveProject()" class="px-2.5 py-1 hover:bg-console-border rounded transition text-console-muted hover:text-white">Save</button>
                <button onclick="app.loadProjectPrompt()" class="px-2.5 py-1 hover:bg-console-border rounded transition text-console-muted hover:text-white">Load</button>
                <button onclick="app.exportProject()" class="px-2.5 py-1 hover:bg-console-border rounded transition text-console-muted hover:text-white">Export</button>
                <label class="px-2.5 py-1 hover:bg-console-border rounded transition text-console-muted hover:text-white cursor-pointer">
                    Import <input type="file" id="importFile" class="hidden" accept=".json" onchange="app.importProject(event)">
                </label>
            </nav>
        </div>

        <div class="flex items-center space-x-3 text-xs">
            <div class="bg-console-bg px-3 py-1 rounded border border-console-border flex items-center space-x-2">
                <span class="text-console-muted">UNDO/REDO:</span>
                <button onclick="app.undo()" class="hover:text-white px-1">↶</button>
                <button onclick="app.redo()" class="hover:text-white px-1">↷</button>
            </div>
            <button onclick="app.masterBlackout = !app.masterBlackout; app.render();" id="btnBO" class="px-3 py-1 font-bold rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-console-border transition">
                BLACKOUT
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 grid grid-cols-12 grid-rows-12 gap-1 p-1 bg-console-bg overflow-hidden">
        
        <!-- LEFT PANEL: TABS (Fixtures, Groups, Presets, Sequences, Effects) -->
        <div class="col-span-12 md:col-span-3 row-span-7 bg-console-panel border border-console-border flex flex-col rounded overflow-hidden">
            <div class="flex bg-console-bg border-b border-console-border text-xs overflow-x-auto shrink-0" id="sidebarTabs">
                <button onclick="app.switchTab('fixtures')" class="px-3 py-2 font-bold border-b-2 border-console-accent text-white flex-1 tab-btn" data-tab="fixtures">FX</button>
                <button onclick="app.switchTab('groups')" class="px-3 py-2 font-bold border-b-2 border-transparent text-console-muted flex-1 tab-btn" data-tab="groups">GRP</button>
                <button onclick="app.switchTab('presets')" class="px-3 py-2 font-bold border-b-2 border-transparent text-console-muted flex-1 tab-btn" data-tab="presets">PRE</button>
                <button onclick="app.switchTab('sequences')" class="px-3 py-2 font-bold border-b-2 border-transparent text-console-muted flex-1 tab-btn" data-tab="sequences">SEQ</button>
                <button onclick="app.switchTab('effects')" class="px-3 py-2 font-bold border-b-2 border-transparent text-console-muted flex-1 tab-btn" data-tab="effects">FXS</button>
                <button onclick="app.switchTab('stage')" class="px-3 py-2 font-bold border-b-2 border-transparent text-console-muted flex-1 tab-btn" data-tab="stage">STAGE</button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 text-xs" id="sidebarContent">
                <!-- Dynamic Sidebar Content -->
            </div>
        </div>

        <!-- CENTER PANEL: STAGE VISUALIZER -->
        <div class="col-span-12 md:col-span-6 row-span-7 bg-black border border-console-border flex flex-col rounded relative overflow-hidden">
            <!-- Stage Toolbar -->
            <div class="absolute top-2 left-2 right-2 z-10 flex flex-wrap items-center justify-between bg-console-panel/80 backdrop-blur border border-console-border p-1.5 rounded text-xs gap-1">
                <div class="flex items-center space-x-1 flex-wrap">
                    <span class="text-console-muted font-bold px-1">TOOL:</span>
                    <button onclick="app.setTool('select')" id="tool-select" class="px-2 py-1 bg-console-accent text-white rounded tool-btn">Select</button>
                    <button onclick="app.setTool('move')" id="tool-move" class="px-2 py-1 bg-console-bg hover:bg-console-border rounded tool-btn">Move</button>
                    <button onclick="app.setTool('rotate')" id="tool-rotate" class="px-2 py-1 bg-console-bg hover:bg-console-border rounded tool-btn">Rotate</button>
                    <button onclick="app.setTool('add')" id="tool-add" class="px-2.5 py-1 bg-green-700 hover:bg-green-600 text-white rounded font-bold">+ Fixture</button>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="app.zoomCanvas(0.1)" class="px-2 py-0.5 bg-console-bg border border-console-border rounded">+</button>
                    <span id="zoomLabel" class="text-console-muted w-12 text-center">100%</span>
                    <button onclick="app.zoomCanvas(-0.1)" class="px-2 py-0.5 bg-console-bg border border-console-border rounded">-</button>
                    <button onclick="app.fitStage()" class="px-2 py-0.5 bg-console-bg border border-console-border rounded">Fit</button>
                </div>
            </div>

            <!-- Canvas Element -->
            <div class="flex-1 relative cursor-crosshair w-full h-full" id="canvasContainer">
                <canvas id="stageCanvas" class="w-full h-full block"></canvas>
            </div>
            
            <!-- Stage Status Overlay -->
            <div class="absolute bottom-2 left-2 pointer-events-none text-[10px] text-console-muted bg-console-panel/60 px-2 py-1 rounded border border-console-border">
                Selected: <span id="selectedCount" class="text-white">0</span> fixtures | FPS: <span id="fpsCounter">60</span>
            </div>
        </div>

        <!-- RIGHT PANEL: EXECUTORS & FADERS -->
        <div class="col-span-12 md:col-span-3 row-span-7 bg-console-panel border border-console-border flex flex-col rounded overflow-hidden">
            <div class="bg-console-bg border-b border-console-border px-3 py-2 text-xs font-bold tracking-wider flex justify-between items-center">
                <span>EXECUTORS & FADERS</span>
                <button onclick="app.addExecutor()" class="text-xs text-console-accent hover:underline">+ Exec</button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2" id="executorsContainer">
                <!-- Dynamically rendered executors -->
            </div>
        </div>

        <!-- LOWER PANEL: PROGRAMMER / CHANNEL VIEW -->
        <div class="col-span-12 md:col-span-9 row-span-4 bg-console-panel border border-console-border flex flex-col rounded overflow-hidden">
            <div class="bg-console-bg border-b border-console-border px-3 py-1.5 text-xs font-bold flex justify-between items-center">
                <span>PROGRAMMER & CHANNEL ATTRIBUTES</span>
                <span id="programmerStatus" class="text-[10px] text-console-accent">No Selection Active</span>
            </div>
            <div class="flex-1 p-3 overflow-x-auto flex items-center space-x-4" id="programmerControls">
                <!-- Attribute Encoders/Sliders -->
                <div class="text-console-muted text-xs italic m-auto">Select one or more fixtures to modify attributes (Dimmer, Pan, Tilt, Color, Zoom, etc.)</div>
            </div>
        </div>

        <!-- BOTTOM-RIGHT PANEL: QUICK PRESETS BAR -->
        <div class="col-span-12 md:col-span-3 row-span-4 bg-console-panel border border-console-border flex flex-col rounded overflow-hidden">
            <div class="bg-console-bg border-b border-console-border px-3 py-1.5 text-xs font-bold flex justify-between items-center">
                <span>QUICK PRESETS</span>
                <button onclick="app.recordPresetPrompt()" class="text-[10px] text-console-accent">+ Record</button>
            </div>
            <div class="flex-1 p-2 grid grid-cols-3 gap-1 overflow-y-auto text-xs" id="quickPresetsContainer">
                <!-- Preset buttons -->
            </div>
        </div>

        <!-- COMMAND LINE (BOTTOM FULL WIDTH) -->
        <div class="col-span-12 row-span-1 bg-black border border-console-border flex items-center px-3 rounded">
            <span class="text-console-accent font-bold text-xs mr-2">CMD&gt;</span>
            <input type="text" id="commandInput" placeholder="Type command (e.g. Fixture 1 At 100, Store Cue 1, Go)..." 
                   class="bg-transparent flex-1 text-xs text-white focus:outline-none font-mono"
                   onkeydown="app.handleCommandInput(event)">
            <button onclick="app.executeCommandFromInput()" class="text-xs bg-console-border hover:bg-zinc-700 px-2 py-1 rounded text-white ml-2">Execute</button>
        </div>

    </div>

    <!-- MODAL CONTAINER -->
    <div id="modalContainer" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div id="modalContent" class="bg-console-panel border border-console-border w-96 rounded p-4 shadow-2xl text-xs space-y-3">
            <!-- Modal body injected dynamically -->
        </div>
    </div>

    <!-- CORE ENGINE & APPLICATION LOGIC -->
    <script>
        class LightingApp {
            constructor() {
                this.project = {
                    name: "Default Project",
                    fixtures: [],
                    groups: [],
                    presets: [
                        { id: 1, type: 'color', name: 'Red', data: { r: 255, g: 0, b: 0 } },
                        { id: 2, type: 'color', name: 'Green', data: { r: 0, g: 255, b: 0 } },
                        { id: 3, type: 'color', name: 'Blue', data: { r: 0, g: 0, b: 255 } },
                        { id: 4, type: 'color', name: 'White', data: { r: 255, g: 255, b: 255 } },
                        { id: 5, type: 'dimmer', name: 'Full (100%)', data: { dimmer: 100 } },
                        { id: 6, type: 'dimmer', name: 'Blackout (0%)', data: { dimmer: 0 } }
                    ],
                    sequences: [
                        { id: 1, name: 'Intro Show', cues: [
                            { number: 1, name: 'Start', fade: 2, delay: 0, state: {} }
                        ]}
                    ],
                    executors: [
                        { id: 1, name: 'MAIN SEQ', type: 'sequence', seqId: 1, fader: 1.0, activeCue: 0, playing: false }
                    ],
                    stageObjects: [
                        { id: 1, type: 'stage', x: 200, y: 300, width: 400, height: 200, rotation: 0 }
                    ],
                    universes: { 1: new Array(512).fill(0) }
                };

                this.activeTab = 'fixtures';
                this.activeTool = 'select';
                this.selectedFixtureIds = [];
                this.clipboard = null;
                this.masterBlackout = false;
                this.zoom = 1.0;
                this.panOffset = { x: 0, y: 0 };
                this.isDragging = false;
                this.dragStart = { x: 0, y: 0 };
                this.history = [];
                this.historyRedo = [];

                // Default initial fixtures if empty
                if (this.project.fixtures.length === 0) {
                    this.initDefaultFixtures();
                }

                this.initCanvas();
                this.initListeners();
                this.render();
                this.startEngineLoop();
            }

            initDefaultFixtures() {
                const types = ['Moving Head', 'Spot', 'Wash', 'LED Bar', 'PAR'];
                for (let i = 1; i <= 6; i++) {
                    this.project.fixtures.push({
                        id: i,
                        name: `Fixture ${i < 10 ? '0' + i : i}`,
                        type: types[(i - 1) % types.length],
                        universe: 1,
                        address: (i - 1) * 16 + 1,
                        channels: 16,
                        x: 150 + (i * 80),
                        y: 180,
                        rotation: 0,
                        attributes: {
                            dimmer: 100,
                            r: 255,
                            g: 255,
                            b: 255,
                            pan: 50,
                            tilt: 50,
                            zoom: 50,
                            focus: 50,
                            strobe: 0
                        }
                    });
                }
            }

            initCanvas() {
                this.canvas = document.getElementById('stageCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Mouse interactions for stage editor
                this.canvas.addEventListener('mousedown', (e) => this.onCanvasMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onCanvasMouseMove(e));
                window.addEventListener('mouseup', (e) => this.onCanvasMouseUp(e));
            }

            resizeCanvas() {
                const container = document.getElementById('canvasContainer');
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
            }

            initListeners() {
                // Global keyboard shortcuts
                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.goFirstExecutor();
                    } else if (e.code === 'Escape') {
                        this.selectedFixtureIds = [];
                        this.render();
                    } else if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        this.undo();
                    } else if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        this.redo();
                    } else if (e.key === 'Delete' || e.key === 'Backspace') {
                        this.deleteSelectedFixtures();
                    }
                });
            }

            startEngineLoop() {
                let lastTime = performance.now();
                let frameCount = 0;
                let lastFpsUpdate = 0;

                const loop = (time) => {
                    frameCount++;
                    if (time - lastFpsUpdate > 1000) {
                        document.getElementById('fpsCounter').innerText = frameCount;
                        frameCount = 0;
                        lastFpsUpdate = time;
                    }

                    this.updateDMXEngine();
                    this.renderCanvas();
                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            }

            updateDMXEngine() {
                // Reset universe 1
                if (!this.project.universes[1]) this.project.universes[1] = new Array(512).fill(0);
                const u1 = this.project.universes[1];
                u1.fill(0);

                // Map fixtures to DMX channels
                this.project.fixtures.forEach(fix => {
                    const addr = fix.address - 1; // 0-indexed
                    const attr = fix.attributes;
                    const dim = this.masterBlackout ? 0 : (attr.dimmer / 100) * 255;

                    u1[addr] = Math.round(dim);
                    u1[addr + 1] = Math.round((attr.r / 255) * 255);
                    u1[addr + 2] = Math.round((attr.g / 255) * 255);
                    u1[addr + 3] = Math.round((attr.b / 255) * 255);
                    u1[addr + 4] = Math.round((attr.pan / 100) * 255);
                    u1[addr + 5] = Math.round((attr.tilt / 100) * 255);
                    u1[addr + 6] = Math.round((attr.zoom / 100) * 255);
                    u1[addr + 7] = Math.round((attr.strobe / 100) * 255);
                });
            }

            renderCanvas() {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;

                ctx.clearRect(0, 0, w, h);

                ctx.save();
                ctx.translate(w / 2 + this.panOffset.x, h / 2 + this.panOffset.y);
                ctx.scale(this.zoom, this.zoom);

                // Draw Grid
                ctx.strokeStyle = '#222222';
                ctx.lineWidth = 1;
                const gridSize = 50;
                for (let x = -1000; x <= 1000; x += gridSize) {
                    ctx.beginPath(); ctx.moveTo(x, -1000); ctx.lineTo(x, 1000); ctx.stroke();
                }
                for (let y = -1000; y <= 1000; y += gridSize) {
                    ctx.beginPath(); ctx.moveTo(-1000, y); ctx.lineTo(1000, y); ctx.stroke();
                }

                // Draw Stage Objects (Floors, Screens, Trusses)
                this.project.stageObjects.forEach(obj => {
                    ctx.save();
                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.rotation * Math.PI / 180);
                    ctx.fillStyle = '#1e1e1e';
                    ctx.strokeStyle = '#444444';
                    ctx.lineWidth = 2;
                    ctx.fillRect(-obj.width / 2, -obj.height / 2, obj.width, obj.height);
                    ctx.strokeRect(-obj.width / 2, -obj.height / 2, obj.width, obj.height);
                    ctx.fillStyle = '#777777';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(obj.type.toUpperCase(), 0, 4);
                    ctx.restore();
                });

                // Draw Fixture Beams & Bodies
                this.project.fixtures.forEach(fix => {
                    const attr = fix.attributes;
                    const isSelected = this.selectedFixtureIds.includes(fix.id);
                    const dimmerVal = this.masterBlackout ? 0 : (attr.dimmer / 100);

                    // Draw Light Beam if dimmer > 0
                    if (dimmerVal > 0) {
                        const colorHex = `rgb(${Math.round(attr.r * dimmerVal)}, ${Math.round(attr.g * dimmerVal)}, ${Math.round(attr.b * dimmerVal)})`;
                        ctx.save();
                        ctx.translate(fix.x, fix.y);
                        
                        const panAngle = ((attr.pan - 50) / 50) * 0.5; // angle offset
                        const beamLength = 180 + (attr.zoom * 0.8);
                        
                        const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, beamLength);
                        grad.addColorStop(0, colorHex);
                        grad.addColorStop(1, 'rgba(0,0,0,0)');

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.moveTo(-10, 0);
                        ctx.lineTo(panAngle * 200 - 40, beamLength);
                        ctx.lineTo(panAngle * 200 + 40, beamLength);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }

                    // Draw Fixture Body
                    ctx.save();
                    ctx.translate(fix.x, fix.y);
                    ctx.rotate((fix.rotation || 0) * Math.PI / 180);

                    ctx.fillStyle = isSelected ? '#3b82f6' : '#2a2a2a';
                    ctx.strokeStyle = isSelected ? '#60a5fa' : '#555555';
                    ctx.lineWidth = isSelected ? 2 : 1;

                    if (fix.type === 'Moving Head') {
                        ctx.beginPath();
                        ctx.arc(0, 0, 14, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        // Lens indicator
                        ctx.fillStyle = `rgb(${Math.round(attr.r * dimmerVal)}, ${Math.round(attr.g * dimmerVal)}, ${Math.round(attr.b * dimmerVal)})`;
                        ctx.beginPath();
                        ctx.arc(0, 0, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-12, -12, 24, 24);
                        ctx.strokeRect(-12, -12, 24, 24);
                    }

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(fix.name, 0, 24);

                    ctx.restore();
                });

                ctx.restore();
            }

            // Canvas Controls & Interactions
            onCanvasMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - this.canvas.width / 2 - this.panOffset.x) / this.zoom;
                const mouseY = (e.clientY - rect.top - this.canvas.height / 2 - this.panOffset.y) / this.zoom;

                if (this.activeTool === 'add') {
                    this.addFixturePrompt(mouseX, mouseY);
                    return;
                }

                // Check fixture hit
                let clickedFixture = null;
                for (let i = this.project.fixtures.length - 1; i >= 0; i--) {
                    const f = this.project.fixtures[i];
                    const dist = Math.hypot(f.x - mouseX, f.y - mouseY);
                    if (dist < 20) {
                        clickedFixture = f;
                        break;
                    }
                }

                if (clickedFixture) {
                    if (e.shiftKey) {
                        if (!this.selectedFixtureIds.includes(clickedFixture.id)) {
                            this.selectedFixtureIds.push(clickedFixture.id);
                        }
                    } else {
                        if (!this.selectedFixtureIds.includes(clickedFixture.id)) {
                            this.selectedFixtureIds = [clickedFixture.id];
                        }
                    }
                    this.isDragging = true;
                    this.dragStart = { x: mouseX, y: mouseY };
                } else {
                    if (!e.shiftKey) this.selectedFixtureIds = [];
                    this.isDragging = true;
                    this.dragStart = { x: e.clientX, y: e.clientY };
                }
                this.render();
            }

            onCanvasMouseMove(e) {
                if (!this.isDragging) return;
                const rect = this.canvas.getBoundingClientRect();

                if (this.selectedFixtureIds.length > 0 && this.activeTool === 'move') {
                    const mouseX = (e.clientX - rect.left - this.canvas.width / 2 - this.panOffset.x) / this.zoom;
                    const mouseY = (e.clientY - rect.top - this.canvas.height / 2 - this.panOffset.y) / this.zoom;
                    const dx = mouseX - this.dragStart.x;
                    const dy = mouseY - this.dragStart.y;

                    this.project.fixtures.forEach(f => {
                        if (this.selectedFixtureIds.includes(f.id)) {
                            f.x += dx;
                            f.y += dy;
                        }
                    });
                    this.dragStart = { x: mouseX, y: mouseY };
                } else {
                    // Pan canvas
                    const dx = e.clientX - this.dragStart.x;
                    const dy = e.clientY - this.dragStart.y;
                    this.panOffset.x += dx;
                    this.panOffset.y += dy;
                    this.dragStart = { x: e.clientX, y: e.clientY };
                }
                this.render();
            }

            onCanvasMouseUp(e) {
                this.isDragging = false;
            }

            zoomCanvas(delta) {
                this.zoom = Math.max(0.2, Math.min(3.0, this.zoom + delta));
                document.getElementById('zoomLabel').innerText = Math.round(this.zoom * 100) + '%';
            }

            fitStage() {
                this.zoom = 1.0;
                this.panOffset = { x: 0, y: 0 };
                document.getElementById('zoomLabel').innerText = '100%';
            }

            setTool(tool) {
                this.activeTool = tool;
                document.querySelectorAll('.tool-btn').forEach(b => {
                    b.classList.remove('bg-console-accent', 'text-white');
                    b.classList.add('bg-console-bg');
                });
                const activeBtn = document.getElementById(`tool-${tool}`);
                if (activeBtn) {
                    activeBtn.classList.remove('bg-console-bg');
                    activeBtn.classList.add('bg-console-accent', 'text-white');
                }
            }

            switchTab(tab) {
                this.activeTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('border-console-accent', 'text-white');
                    b.classList.add('border-transparent', 'text-console-muted');
                    if (b.dataset.tab === tab) {
                        b.classList.add('border-console-accent', 'text-white');
                        b.classList.remove('text-console-muted');
                    }
                });
                this.renderSidebar();
            }

            render() {
                this.renderSidebar();
                this.renderProgrammer();
                this.renderExecutors();
                this.renderQuickPresets();
                document.getElementById('selectedCount').innerText = this.selectedFixtureIds.length;
            }

            renderSidebar() {
                const container = document.getElementById('sidebarContent');
                let html = '';

                if (this.activeTab === 'fixtures') {
                    html += `<div class="space-y-1 mb-2">
                        <button onclick="app.addFixturePrompt()" class="w-full py-1.5 bg-console-border hover:bg-zinc-700 text-white rounded font-bold">+ Add Fixture</button>
                    </div>`;
                    this.project.fixtures.forEach(f => {
                        const isSel = this.selectedFixtureIds.includes(f.id);
                        html += `<div onclick="app.selectFixture(${f.id}, event)" class="p-2 rounded border ${isSel ? 'border-console-accent bg-console-accent/10' : 'border-console-border bg-console-bg'} flex justify-between items-center cursor-pointer">
                            <div>
                                <div class="font-bold text-white">${f.name}</div>
                                <div class="text-[10px] text-console-muted">${f.type} | U:${f.universe} A:${f.address}</div>
                            </div>
                            <button onclick="event.stopPropagation(); app.deleteFixture(${f.id})" class="text-console-muted hover:text-red-500">×</button>
                        </div>`;
                    });
                } else if (this.activeTab === 'groups') {
                    html += `<div class="text-console-muted italic">Group management & selection sets.</div>`;
                } else if (this.activeTab === 'presets') {
                    html += `<div class="space-y-1">`;
                    this.project.presets.forEach(p => {
                        html += `<div class="p-2 border border-console-border bg-console-bg rounded flex justify-between items-center">
                            <div><span class="text-white font-bold">${p.name}</span> <span class="text-[10px] text-console-muted">(${p.type})</span></div>
                            <button onclick="app.applyPreset(${p.id})" class="px-2 py-0.5 bg-console-accent text-white rounded">Apply</button>
                        </div>`;
                    });
                    html += `</div>`;
                } else if (this.activeTab === 'sequences') {
                    html += `<div class="space-y-2">
                        <button onclick="app.addSequencePrompt()" class="w-full py-1 bg-console-border hover:bg-zinc-700 text-white rounded">+ New Sequence</button>`;
                    this.project.sequences.forEach(seq => {
                        html += `<div class="border border-console-border p-2 rounded bg-console-bg space-y-1">
                            <div class="font-bold text-white flex justify-between"><span>${seq.name}</span><span>ID: ${seq.id}</span></div>
                            <div class="text-[10px] text-console-muted">Cues: ${seq.cues.length}</div>
                            <button onclick="app.recordCueToSequence(${seq.id})" class="w-full py-0.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded text-[10px]">Record Current State to Cue</button>
                        </div>`;
                    });
                    html += `</div>`;
                } else if (this.activeTab === 'effects') {
                    html += `<div class="space-y-2 text-console-muted">
                        <div class="font-bold text-white">Active FX Engine</div>
                        <div class="p-2 bg-console-bg border border-console-border rounded">
                            <div>Rainbow Color Chase</div>
                            <button onclick="app.toggleEffect('rainbow')" class="mt-1 px-2 py-0.5 bg-console-accent text-white rounded text-[10px]">Toggle FX</button>
                        </div>
                    </div>`;
                } else if (this.activeTab === 'stage') {
                    html += `<div class="space-y-2">
                        <button onclick="app.addStageObject('screen')" class="w-full py-1 bg-console-border hover:bg-zinc-700 text-white rounded">+ Add LED Screen</button>
                        <button onclick="app.addStageObject('truss')" class="w-full py-1 bg-console-border hover:bg-zinc-700 text-white rounded">+ Add Truss</button>
                    </div>`;
                }

                container.innerHTML = html;
            }

            renderProgrammer() {
                const container = document.getElementById('programmerControls');
                const status = document.getElementById('programmerStatus');

                if (this.selectedFixtureIds.length === 0) {
                    status.innerText = "No Selection Active";
                    container.innerHTML = `<div class="text-console-muted text-xs italic m-auto">Select fixtures on stage or sidebar to program attributes.</div>`;
                    return;
                }

                status.innerText = `${this.selectedFixtureIds.length} Fixture(s) Selected`;
                const firstFix = this.project.fixtures.find(f => f.id === this.selectedFixtureIds[0]);
                const attr = firstFix ? firstFix.attributes : {};

                container.innerHTML = `
                    <div class="flex space-x-6 items-center">
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-console-muted mb-1">DIMMER</span>
                            <input type="range" min="0" max="100" value="${attr.dimmer || 0}" class="h-24 slider-vertical" oninput="app.updateAttribute('dimmer', this.value)">
                            <span class="text-xs mt-1 text-white">${attr.dimmer || 0}%</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-console-muted mb-1">PAN</span>
                            <input type="range" min="0" max="100" value="${attr.pan || 50}" class="h-24 slider-vertical" oninput="app.updateAttribute('pan', this.value)">
                            <span class="text-xs mt-1 text-white">${attr.pan || 50}%</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-console-muted mb-1">TILT</span>
                            <input type="range" min="0" max="100" value="${attr.tilt || 50}" class="h-24 slider-vertical" oninput="app.updateAttribute('tilt', this.value)">
                            <span class="text-xs mt-1 text-white">${attr.tilt || 50}%</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-console-muted mb-1">ZOOM</span>
                            <input type="range" min="0" max="100" value="${attr.zoom || 50}" class="h-24 slider-vertical" oninput="app.updateAttribute('zoom', this.value)">
                            <span class="text-xs mt-1 text-white">${attr.zoom || 50}%</span>
                        </div>
                        <div class="flex flex-col space-y-2 border-l border-console-border pl-4">
                            <span class="text-[10px] text-console-muted">COLOR MIX (RGB)</span>
                            <div class="flex items-center space-x-2">
                                <input type="color" value="${this.rgbToHex(attr.r || 255, attr.g || 255, attr.b || 255)}" onchange="app.updateColorPicker(this.value)" class="w-10 h-10 bg-transparent cursor-pointer rounded">
                                <div class="text-[10px] text-white">R:${attr.r} G:${attr.g} B:${attr.b}</div>
                            </div>
                            <div class="flex space-x-1 mt-2">
                                <button onclick="app.setRGB(255,0,0)" class="w-6 h-6 bg-red-600 rounded"></button>
                                <button onclick="app.setRGB(0,255,0)" class="w-6 h-6 bg-green-600 rounded"></button>
                                <button onclick="app.setRGB(0,0,255)" class="w-6 h-6 bg-blue-600 rounded"></button>
                                <button onclick="app.setRGB(255,255,255)" class="w-6 h-6 bg-white rounded"></button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderExecutors() {
                const container = document.getElementById('executorsContainer');
                let html = '';
                this.project.executors.forEach(exec => {
                    html += `<div class="border border-console-border bg-console-bg p-2 rounded flex flex-col space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-white">EXEC 0${exec.id}</span>
                            <span class="text-[10px] text-console-accent">${exec.playing ? 'RUNNING' : 'IDLE'}</span>
                        </div>
                        <div class="text-[10px] text-console-muted truncate">Assigned: ${exec.name}</div>
                        <div class="flex items-center space-x-2">
                            <button onclick="app.goExecutor(${exec.id})" class="flex-1 py-1 bg-console-accent hover:bg-console-accentHover text-white rounded font-bold text-xs">GO</button>
                            <button onclick="app.stopExecutor(${exec.id})" class="px-2 py-1 bg-console-border hover:bg-zinc-700 text-white rounded text-xs">PAUSE</button>
                        </div>
                        <input type="range" min="0" max="100" value="${exec.fader * 100}" class="w-full accent-console-accent" oninput="app.updateExecutorFader(${exec.id}, this.value)">
                    </div>`;
                });
                container.innerHTML = html;
            }

            renderQuickPresets() {
                const container = document.getElementById('quickPresetsContainer');
                let html = '';
                this.project.presets.forEach(p => {
                    html += `<button onclick="app.applyPreset(${p.id})" class="p-2 border border-console-border bg-console-bg hover:bg-console-border rounded text-center truncate text-white font-bold">${p.name}</button>`;
                });
                container.innerHTML = html;
            }

            // Fixture Actions
            selectFixture(id, e) {
                if (e.shiftKey) {
                    if (!this.selectedFixtureIds.includes(id)) this.selectedFixtureIds.push(id);
                } else {
                    this.selectedFixtureIds = [id];
                }
                this.render();
            }

            updateAttribute(attrName, val) {
                const numVal = parseFloat(val);
                this.project.fixtures.forEach(f => {
                    if (this.selectedFixtureIds.includes(f.id)) {
                        f.attributes[attrName] = numVal;
                    }
                });
            }

            setRGB(r, g, b) {
                this.project.fixtures.forEach(f => {
                    if (this.selectedFixtureIds.includes(f.id)) {
                        f.attributes.r = r;
                        f.attributes.g = g;
                        f.attributes.b = b;
                    }
                });
                this.render();
            }

            updateColorPicker(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                this.setRGB(r, g, b);
            }

            rgbToHex(r, g, b) {
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            // Prompts & Modals
            addFixturePrompt(x = 100, y = 100) {
                const modal = document.getElementById('modalContainer');
                const content = document.getElementById('modalContent');
                modal.classList.remove('hidden');

                content.innerHTML = `
                    <div class="font-bold text-white text-sm mb-2">Add New Fixture</div>
                    <div class="space-y-2">
                        <div>
                            <label class="text-console-muted">Name</label>
                            <input type="text" id="newFixName" value="Moving Head 0${this.project.fixtures.length + 1}" class="w-full bg-console-bg border border-console-border p-1.5 rounded text-white mt-1">
                        </div>
                        <div>
                            <label class="text-console-muted">Type</label>
                            <select id="newFixType" class="w-full bg-console-bg border border-console-border p-1.5 rounded text-white mt-1">
                                <option>Moving Head</option>
                                <option>Spot</option>
                                <option>Wash</option>
                                <option>LED Bar</option>
                                <option>PAR</option>
                            </select>
                        </div>
                        <div class="flex space-x-2">
                            <div class="flex-1">
                                <label class="text-console-muted">Universe</label>
                                <input type="number" id="newFixUniv" value="1" class="w-full bg-console-bg border border-console-border p-1.5 rounded text-white mt-1">
                            </div>
                            <div class="flex-1">
                                <label class="text-console-muted">DMX Address</label>
                                <input type="number" id="newFixAddr" value="${this.project.fixtures.length * 16 + 1}" class="w-full bg-console-bg border border-console-border p-1.5 rounded text-white mt-1">
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2 mt-4">
                        <button onclick="document.getElementById('modalContainer').classList.add('hidden')" class="px-3 py-1 bg-console-border rounded text-white">Cancel</button>
                        <button onclick="app.confirmAddFixture(${x}, ${y})" class="px-3 py-1 bg-console-accent rounded text-white font-bold">Add</button>
                    </div>
                `;
            }

            confirmAddFixture(x, y) {
                const name = document.getElementById('newFixName').value;
                const type = document.getElementById('newFixType').value;
                const universe = parseInt(document.getElementById('newFixUniv').value);
                const address = parseInt(document.getElementById('newFixAddr').value);

                this.project.fixtures.push({
                    id: Date.now(),
                    name, type, universe, address, channels: 16,
                    x, y, rotation: 0,
                    attributes: { dimmer: 100, r: 255, g: 255, b: 255, pan: 50, tilt: 50, zoom: 50, focus: 50, strobe: 0 }
                });

                document.getElementById('modalContainer').classList.add('hidden');
                this.render();
            }

            deleteFixture(id) {
                this.project.fixtures = this.project.fixtures.filter(f => f.id !== id);
                this.selectedFixtureIds = this.selectedFixtureIds.filter(i => i !== id);
                this.render();
            }

            deleteSelectedFixtures() {
                if (this.selectedFixtureIds.length === 0) return;
                this.project.fixtures = this.project.fixtures.filter(f => !this.selectedFixtureIds.includes(f.id));
                this.selectedFixtureIds = [];
                this.render();
            }

            addStageObject(type) {
                this.project.stageObjects.push({
                    id: Date.now(),
                    type,
                    x: 0, y: 0,
                    width: type === 'screen' ? 200 : 150,
                    height: type === 'screen' ? 100 : 30,
                    rotation: 0
                });
                this.render();
            }

            // Presets & Cues
            applyPreset(id) {
                const p = this.project.presets.find(item => item.id === id);
                if (!p) return;
                this.project.fixtures.forEach(f => {
                    if (this.selectedFixtureIds.includes(f.id)) {
                        if (p.type === 'color') {
                            f.attributes.r = p.data.r;
                            f.attributes.g = p.data.g;
                            f.attributes.b = p.data.b;
                        } else if (p.type === 'dimmer') {
                            f.attributes.dimmer = p.data.dimmer;
                        }
                    }
                });
            }

            recordPresetPrompt() {
                const name = prompt("Enter Preset Name:");
                if (!name) return;
                this.project.presets.push({
                    id: Date.now(),
                    type: 'color',
                    name,
                    data: { r: 255, g: 100, b: 0 }
                });
                this.render();
            }

            addSequencePrompt() {
                const name = prompt("Enter Sequence Name:");
                if (!name) return;
                this.project.sequences.push({
                    id: Date.now(),
                    name,
                    cues: []
                });
                this.render();
            }

            recordCueToSequence(seqId) {
                const seq = this.project.sequences.find(s => s.id === seqId);
                if (!seq) return;
                const cueNum = seq.cues.length + 1;
                const fixtureStates = {};
                this.project.fixtures.forEach(f => {
                    fixtureStates[f.id] = JSON.parse(JSON.stringify(f.attributes));
                });
                seq.cues.push({
                    number: cueNum,
                    name: `Cue ${cueNum}`,
                    state: fixtureStates
                });
                alert(`Cue ${cueNum} recorded successfully to sequence ${seq.name}!`);
            }

            // Executors
            goExecutor(execId) {
                const exec = this.project.executors.find(e => e.id === execId);
                if (!exec) return;
                exec.playing = true;
                const seq = this.project.sequences.find(s => s.id === exec.seqId);
                if (!seq || seq.cues.length === 0) return;

                exec.activeCue = (exec.activeCue + 1) % seq.cues.length;
                const cue = seq.cues[exec.activeCue];
                
                // Apply cue state to fixtures
                for (let fixId in cue.state) {
                    const fix = this.project.fixtures.find(f => f.id == fixId);
                    if (fix) {
                        fix.attributes = JSON.parse(JSON.stringify(cue.state[fixId]));
                    }
                }
                this.renderExecutors();
            }

            stopExecutor(execId) {
                const exec = this.project.executors.find(e => e.id === execId);
                if (exec) exec.playing = false;
                this.renderExecutors();
            }

            updateExecutorFader(execId, val) {
                const exec = this.project.executors.find(e => e.id === execId);
                if (exec) exec.fader = val / 100;
            }

            goFirstExecutor() {
                if (this.project.executors.length > 0) {
                    this.goExecutor(this.project.executors[0].id);
                }
            }

            // Effects Engine
            toggleEffect(type) {
                // Simple effect trigger example
                alert(`Effect ${type} toggled for selected fixtures.`);
            }

            // Command Line parser
            handleCommandInput(e) {
                if (e.key === 'Enter') {
                    this.executeCommandFromInput();
                }
            }

            executeCommandFromInput() {
                const input = document.getElementById('commandInput');
                const cmd = input.value.trim();
                input.value = '';
                if (!cmd) return;

                const parts = cmd.toLowerCase().split(' ');
                if (parts[0] === 'fixture') {
                    const id = parseInt(parts[1]);
                    if (!isNaN(id)) {
                        this.selectedFixtureIds = [id];
                        if (parts[2] === 'at') {
                            const val = parseInt(parts[3]);
                            if (!isNaN(val)) {
                                this.updateAttribute('dimmer', val);
                            }
                        }
                    }
                } else if (parts[0] === 'go') {
                    this.goFirstExecutor();
                } else if (parts[0] === 'clear') {
                    this.selectedFixtureIds = [];
                }
                this.render();
            }

            // Project Management
            newProject() {
                if (confirm("Create new project? Unsaved changes will be lost.")) {
                    this.project = {
                        name: "New Project",
                        fixtures: [], groups: [], presets: [], sequences: [], executors: [], stageObjects: [], universes: { 1: new Array(512).fill(0) }
                    };
                    this.selectedFixtureIds = [];
                    this.initDefaultFixtures();
                    this.render();
                }
            }

            saveProject() {
                localStorage.setItem('luxcontrol_project', JSON.stringify(this.project));
                alert("Project saved to browser localStorage successfully!");
            }

            loadProjectPrompt() {
                const data = localStorage.getItem('luxcontrol_project');
                if (!data) {
                    alert("No saved project found in localStorage.");
                    return;
                }
                try {
                    this.project = JSON.parse(data);
                    this.selectedFixtureIds = [];
                    this.render();
                    alert("Project loaded successfully!");
                } catch (err) {
                    alert("Failed to load project data.");
                }
            }

            exportProject() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.project, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", "project.json");
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
            }

            importProject(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        this.project = JSON.parse(e.target.result);
                        this.selectedFixtureIds = [];
                        this.render();
                        alert("Project imported successfully!");
                    } catch (err) {
                        alert("Invalid project JSON file.");
                    }
                };
                reader.readAsText(file);
            }

            undo() {
                // Placeholder for undo state machine
            }

            redo() {
                // Placeholder for redo state machine
            }
        }

        // Initialize App on DOM load
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new LightingApp();
        });
    </script>
</body>
</html>
