<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA3 onPC Web Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #dcdcdc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOP MENU BAR */
        .top-bar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #2d2d2d;
            height: 35px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            justify-content: space-between;
        }

        .menu-group {
            display: flex;
            gap: 5px;
        }

        .ma-btn {
            background-color: #2b2b2b;
            color: #ccc;
            border: 1px solid #444;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2px;
            transition: all 0.1s;
        }

        .ma-btn:hover {
            background-color: #383838;
            color: #fff;
            border-color: #ff9900;
        }

        .ma-btn:active, .ma-btn.active {
            background-color: #ff9900;
            color: #000;
            border-color: #ffaa22;
        }

        /* MAIN WORKSPACE LAYOUT */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            grid-template-rows: 1fr 180px;
            gap: 4px;
            padding: 4px;
            background-color: #0b0b0b;
        }

        /* WINDOW PANELS */
        .ma-window {
            background-color: #181818;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 3px;
        }

        .window-header {
            background-color: #222;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #ff9900;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .window-content {
            flex: 1;
            overflow: auto;
            padding: 5px;
        }

        /* FIXTURE SHEET TABLE */
        .fixture-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: left;
            font-family: monospace;
        }

        .fixture-table th, .fixture-table td {
            border: 1px solid #2a2a2a;
            padding: 4px 6px;
        }

        .fixture-table th {
            background-color: #222;
            color: #aaa;
            position: sticky;
            top: 0;
        }

        .fixture-row {
            cursor: pointer;
        }

        .fixture-row:hover {
            background-color: #222;
        }

        .fixture-row.selected {
            background-color: #3d2b00;
            border-left: 3px solid #ff9900;
        }

        /* VISUALIZER CANVAS */
        #visualizer-container {
            position: relative;
            background-color: #050505;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 1px solid #222;
        }

        /* ENCODERS / RIGHT SIDE */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .encoders-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            padding: 5px;
        }

        .encoder-box {
            background: #202020;
            border: 1px solid #333;
            padding: 6px;
            text-align: center;
            border-radius: 3px;
        }

        .encoder-title {
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        .encoder-value {
            font-size: 14px;
            color: #00d2ff;
            font-weight: bold;
            font-family: monospace;
        }

        /* COLOR PICKER PANEL */
        .color-controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
            font-size: 11px;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-row input[type="range"] {
            flex: 1;
        }

        /* EXECUTORS (BOTTOM AREA) */
        .executors-area {
            grid-column: span 2;
            background-color: #151515;
            border: 1px solid #333;
            display: flex;
            gap: 6px;
            padding: 6px;
            overflow-x: auto;
        }

        .executor-fader-strip {
            background: #1e1e1e;
            border: 1px solid #333;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px;
            border-radius: 2px;
        }

        .exec-num {
            font-size: 10px;
            color: #ff9900;
            font-weight: bold;
        }

        .fader-track {
            flex: 1;
            margin: 6px 0;
            display: flex;
            justify-content: center;
        }

        .fader-track input[type=range] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 20px;
            height: 90px;
            cursor: pointer;
        }

        .exec-buttons {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .exec-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            font-size: 9px;
            padding: 3px 0;
            text-align: center;
            cursor: pointer;
            border-radius: 2px;
        }

        .exec-btn.go { background-color: #004400; border-color: #008800; }
        .exec-btn.flash { background-color: #443300; border-color: #aa8800; }

        /* COMMAND LINE BAR (BOTTOM-MOST) */
        .command-bar {
            background-color: #111;
            border-top: 2px solid #ff9900;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }

        .command-prompt-label {
            color: #ff9900;
            font-weight: bold;
            font-size: 13px;
            font-family: monospace;
        }

        .command-input {
            flex: 1;
            background-color: #000;
            border: 1px solid #444;
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 5px 8px;
            outline: none;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- TOP CONTROL STRIP -->
    <div class="top-bar">
        <div class="menu-group">
            <button class="ma-btn" onclick="openModal('Patch')">Patch</button>
            <button class="ma-btn" onclick="openModal('Fixture')">Fixture Sheet</button>
            <button class="ma-btn" onclick="clearProgrammer()">Clear 2x</button>
        </div>
        <div style="font-size: 11px; color: #888;">grandMA3 onPC - Web Simulator v1.0</div>
        <div class="menu-group">
            <button class="ma-btn" style="background:#400; color:#fff;" onclick="resetAll()">Reset</button>
        </div>
    </div>

    <!-- MAIN GRID WORKSPACE -->
    <div class="workspace">
        
        <!-- TOP LEFT: FIXTURE SHEET / VIEW -->
        <div class="ma-window">
            <div class="window-header">
                <span>Fixture Sheet [All Fixtures]</span>
                <span>Programmer Active</span>
            </div>
            <div class="window-content">
                <table class="fixture-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Patch</th>
                            <th>Dimmer</th>
                            <th>RGBW Colors</th>
                            <th>Pan/Tilt</th>
                        </tr>
                    </thead>
                    <tbody id="fixture-table-body">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TOP RIGHT: ENCODERS & COLOR PICKER -->
        <div class="right-panel">
            <div class="ma-window" style="flex: 1;">
                <div class="window-header">Virtual Encoders</div>
                <div class="encoders-grid">
                    <div class="encoder-box">
                        <div class="encoder-title">DIMMER</div>
                        <div class="encoder-value" id="enc-dim">100%</div>
                    </div>
                    <div class="encoder-box">
                        <div class="encoder-title">PAN</div>
                        <div class="encoder-value" id="enc-pan">50°</div>
                    </div>
                    <div class="encoder-box">
                        <div class="encoder-title">TILT</div>
                        <div class="encoder-value" id="enc-tilt">50°</div>
                    </div>
                    <div class="encoder-box">
                        <div class="encoder-title">ZOOM</div>
                        <div class="encoder-value" id="enc-zoom">25°</div>
                    </div>
                </div>
            </div>

            <div class="ma-window" style="flex: 1;">
                <div class="window-header">Color Picker & Mix</div>
                <div class="color-controls">
                    <div class="color-row">
                        <span>R:</span> <input type="range" id="range-r" min="0" max="255" value="255" oninput="updateColorFromSliders()">
                    </div>
                    <div class="color-row">
                        <span>G:</span> <input type="range" id="range-g" min="0" max="255" value="255" oninput="updateColorFromSliders()">
                    </div>
                    <div class="color-row">
                        <span>B:</span> <input type="range" id="range-b" min="0" max="255" value="255" oninput="updateColorFromSliders()">
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM: STAGE VISUALIZER -->
        <div class="ma-window" style="grid-column: span 2; height: 170px;">
            <div class="window-header">Visualizer Stage (2D Beam Simulation)</div>
            <div id="visualizer-container">
                <canvas id="simCanvas" width="600" height="130"></canvas>
            </div>
        </div>

        <!-- EXECUTORS STRIP -->
        <div class="executors-area" id="executors-container">
            <!-- Dynamic Executors generated via JS -->
        </div>

    </div>

    <!-- COMMAND LINE BAR -->
    <div class="command-bar">
        <span class="command-prompt-label">MA3 &gt;</span>
        <input type="text" id="commandInput" class="command-input" placeholder="Type command e.g., 'Fixture 1 At 50' or 'Store Cue 1'..." onkeypress="handleCommand(event)">
        <button class="ma-btn" style="height: 28px; background:#ff9900; color:#000;" onclick="executeCommandBtn()">Please</button>
    </div>

    <!-- JAVASCRIPT CORE LOGIC -->
    <script>
        // --- FIXTURE DATABASE (LIBRARY) ---
        let fixtures = [
            { id: 1, name: 'Spot 01', patch: '1.001', dimmer: 100, r: 255, g: 0, b: 0, pan: 40, tilt: 50, selected: true },
            { id: 2, name: 'Spot 02', patch: '1.017', dimmer: 100, r: 0, g: 255, b: 0, pan: 48, tilt: 50, selected: false },
            { id: 3, name: 'Wash 01', patch: '1.033', dimmer: 100, r: 0, g: 0, b: 255, pan: 52, tilt: 50, selected: false },
            { id: 4, name: 'Wash 02', patch: '1.049', dimmer: 100, r: 255, g: 255, b: 0, pan: 60, tilt: 50, selected: false }
        ];

        let executors = [
            { id: 1, name: "Main Cue", level: 100, active: true },
            { id: 2, name: "Strobe FX", level: 0, active: false },
            { id: 3, name: "Blinder", level: 0, active: false },
            { id: 4, name: "House", level: 80, active: false },
            { id: 5, name: "Special", level: 0, active: false }
        ];

        // --- RENDER UI ---
        function renderUI() {
            // Render Fixture Table
            const tbody = document.getElementById('fixture-table-body');
            tbody.innerHTML = '';
            fixtures.forEach(f => {
                let tr = document.createElement('tr');
                tr.className = `fixture-row ${f.selected ? 'selected' : ''}`;
                tr.onclick = () => toggleSelectFixture(f.id);
                tr.innerHTML = `
                    <td>${f.id}</td>
                    <td>${f.name}</td>
                    <td>${f.patch}</td>
                    <td>${f.dimmer}%</td>
                    <td><span style="display:inline-block;width:12px;height:12px;background:rgb(${f.r},${f.g},${f.b});border-radius:2px;vertical-align:middle;"></span> RGB(${f.r},${f.g},${f.b})</td>
                    <td>P:${f.pan}° T:${f.tilt}°</td>
                `;
                tbody.appendChild(tr);
            });

            // Render Executors
            const execContainer = document.getElementById('executors-container');
            execContainer.innerHTML = '';
            executors.forEach(ex => {
                let strip = document.createElement('div');
                strip.className = 'executor-fader-strip';
                strip.innerHTML = `
                    <span class="exec-num">Ex ${ex.id}</span>
                    <span style="font-size:9px; color:#aaa; text-align:center;">${ex.name}</span>
                    <div class="fader-track">
                        <input type="range" min="0" max="100" value="${ex.level}" oninput="updateExecutor(${ex.id}, this.value)">
                    </div>
                    <div class="exec-buttons">
                        <button class="exec-btn go" onclick="trigExec(${ex.id}, 'GO')">GO</button>
                        <button class="exec-btn flash" onclick="trigExec(${ex.id}, 'FLASH')">FLH</button>
                    </div>
                `;
                execContainer.appendChild(strip);
            });

            updateEncodersDisplay();
        }

        function updateEncodersDisplay() {
            let sel = fixtures.find(f => f.selected);
            if (sel) {
                document.getElementById('enc-dim').innerText = sel.dimmer + '%';
                document.getElementById('enc-pan').innerText = sel.pan + '°';
                document.getElementById('enc-tilt').innerText = sel.tilt + '°';
                document.getElementById('range-r').value = sel.r;
                document.getElementById('range-g').value = sel.g;
                document.getElementById('range-b').value = sel.b;
            }
        }

        function toggleSelectFixture(id) {
            fixtures.forEach(f => {
                if (f.id === id) f.selected = !f.selected;
            });
            renderUI();
        }

        function clearProgrammer() {
            fixtures.forEach(f => f.selected = false);
            if(fixtures.length > 0) fixtures[0].selected = true;
            renderUI();
        }

        function resetAll() {
            fixtures.forEach(f => { f.dimmer = 100; f.r = 255; f.g = 255; f.b = 255; });
            renderUI();
        }

        function updateColorFromSliders() {
            let r = parseInt(document.getElementById('range-r').value);
            let g = parseInt(document.getElementById('range-g').value);
            let b = parseInt(document.getElementById('range-b').value);

            fixtures.forEach(f => {
                if (f.selected) {
                    f.r = r; f.g = g; f.b = b;
                }
            });
            renderUI();
        }

        function updateExecutor(id, val) {
            let ex = executors.find(e => e.id === id);
            if (ex) ex.level = parseInt(val);
        }

        function trigExec(id, action) {
            console.log(`Executor ${id} triggered action: ${action}`);
        }

        // --- COMMAND LINE PROCESSOR (MA Syntax Parser) ---
        function handleCommand(e) {
            if (e.key === 'Enter') {
                executeCommandBtn();
            }
        }

        function executeCommandBtn() {
            let input = document.getElementById('commandInput');
            let cmd = input.value.trim();
            parseMACommand(cmd);
            input.value = '';
        }

        function parseMACommand(cmd) {
            let parts = cmd.toLowerCase().split(' ');
            
            // Contoh parsing dasar ala MA: "fixture 1 at 50" atau "at 0"
            if (parts[0] === 'fixture' || parts[0] === 'fix') {
                let targetId = parseInt(parts[1]);
                fixtures.forEach(f => {
                    f.selected = (f.id === targetId || parts[1] === 'thru');
                });
                
                // Cek apakah ada perintah "at" di belakangnya
                let atIndex = parts.indexOf('at');
                if (atIndex !== -1 && parts[atIndex + 1]) {
                    let val = parseInt(parts[atIndex + 1]);
                    fixtures.forEach(f => {
                        if (f.selected) f.dimmer = val;
                    });
                }
            } else if (parts[0] === 'at') {
                let val = parseInt(parts[1]);
                if (!isNaN(val)) {
                    fixtures.forEach(f => {
                        if (f.selected) f.dimmer = val;
                    });
                }
            } else if (parts[0] === 'clear') {
                clearProgrammer();
            } else {
                alert("Command syntax not recognized: " + cmd);
            }
            renderUI();
        }

        function openModal(type) {
            alert("Opening " + type + " modal window (MA3 style setup view).");
        }

        // --- 2D CANVAS VISUALIZER ENGINE ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function drawVisualizer() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let spacing = canvas.width / (fixtures.length + 1);

            fixtures.forEach((f, idx) => {
                let x = spacing * (idx + 1);
                let y = 20;

                // Gambar fixture head di atas
                ctx.fillStyle = f.selected ? '#ff9900' : '#555';
                ctx.fillRect(x - 12, y - 5, 24, 10);

                // Hitung sudut beam berdasarkan Pan/Tilt simulasi
                let beamSpread = (f.dimmer / 100) * 40;
                let targetX = x + (f.pan - 50) * 1.5;

                // Gambar kerucut cahaya (Beam Projection)
                if (f.dimmer > 0) {
                    ctx.save();
                    let grad = ctx.createLinearGradient(x, y, targetX, canvas.height);
                    grad.addColorStop(0, `rgba(${f.r}, ${f.g}, ${f.b}, ${f.dimmer / 100 * 0.7})`);
                    grad.addColorStop(1, `rgba(${f.r}, ${f.g}, ${f.b}, 0)`);

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(targetX - beamSpread, canvas.height);
                    ctx.lineTo(targetX + beamSpread, canvas.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    // Titik lampu di lantai stage
                    ctx.beginPath();
                    ctx.arc(targetX, canvas.height - 5, 8 + (f.dimmer/10), 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${f.r}, ${f.g}, ${f.b})`;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `rgb(${f.r}, ${f.g}, ${f.b})`;
                    ctx.fill();
                    ctx.shadowBlur = 0; // reset
                }
            });

            requestAnimationFrame(drawVisualizer);
        }

        // Inisialisasi awal
        renderUI();
        drawVisualizer();
    </script>
</body>
</html>
